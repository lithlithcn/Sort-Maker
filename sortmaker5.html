}

const SAVE_FORMAT = "sorter-maker-save";

const SAVE_VERSION = 3;

const btnSaveImport = document.getElementById("btnSaveImport");

const btnLoadImport = document.getElementById("btnLoadImport");

const btnLoadSort = document.getElementById("btnLoadSort");

function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    const chunkSize = 32768;
    for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
}

function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
}

function pad2(n) {
    return String(n).padStart(2, "0");
}

function buildSaveFilename() {
    const now = new Date;
    return `sorter-maker-${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.sorter-save`;
}

const SAVE_MAGIC = "SMB1";

async function isAnimatedGif(file) {
    try {
        const buffer = await file.arrayBuffer();
        const b = new Uint8Array(buffer);
        if (b.length < 13) return true;
        const packed = b[10];
        const gctFlag = (packed & 128) !== 0;
        const gctSize = gctFlag ? 3 * Math.pow(2, (packed & 7) + 1) : 0;
        let pos = 13 + gctSize;
        let frames = 0;
        function skipSubBlocks(p) {
            while (p < b.length) {
                const size = b[p];
                p += 1;
                if (size === 0) break;
                p += size;
            }
            return p;
        }
        while (pos < b.length) {
            const marker = b[pos];
            if (marker === 33) {
                pos += 2;
                pos = skipSubBlocks(pos);
            } else if (marker === 44) {
                frames++;
                if (frames > 1) return true;
                const packedByte = b[pos + 9];
                const lctFlag = (packedByte & 128) !== 0;
                const lctSize = lctFlag ? 3 * Math.pow(2, (packedByte & 7) + 1) : 0;
                pos = pos + 10 + lctSize + 1;
                pos = skipSubBlocks(pos);
            } else {
                break;
            }
        }
        return frames > 1;
    } catch (err) {
        return true;
    }
}

async function getCompressionStrategy(item) {
    if (item._compressionStrategy !== undefined) return item._compressionStrategy;
    let strategy = null;
    if (item.type === "image" && item.file) {
        strategy = item.file.type === "image/svg+xml" ? "svg" : "raster";
    } else if (item.type === "gif" && item.file) {
        const animated = await isAnimatedGif(item.file);
        strategy = animated ? null : "raster";
    }
    item._compressionStrategy = strategy;
    return strategy;
}

async function getCompressibleItems() {
    const candidates = images.filter(it => it.file && (it.type === "image" || it.type === "gif"));
    const results = [];
    await runWithConcurrency(candidates, 8, async item => {
        const strategy = await getCompressionStrategy(item);
        if (strategy) results.push({
            item: item,
            strategy: strategy
        });
    });
    return results;
}

async function compressImageBlob(file, quality) {
    return Promise.race([ compressImageBlobInner(file, quality), new Promise((_, reject) => setTimeout(() => reject(new Error("Compression timed out")), 2e4)) ]);
}

async function compressImageBlobInner(file, quality) {
    const drawable = await loadDrawable(file);
    try {
        const canvas = document.createElement("canvas");
        canvas.width = drawable.width;
        canvas.height = drawable.height;
        canvas.getContext("2d").drawImage(drawable.source, 0, 0);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/webp", quality));
        if (!blob || blob.size >= file.size) return null;
        return blob;
    } finally {
        drawable.close();
    }
}

function minifySvgText(text) {
    return text.replace(/<!--[\s\S]*?-->/g, "").replace(/>\s+</g, "><").replace(/\s{2,}/g, " ").trim();
}

async function compressSvgBlob(file) {
    const text = await file.text();
    const minified = minifySvgText(text);
    if (!minified) return null;
    const blob = new Blob([ minified ], {
        type: "image/svg+xml"
    });
    if (blob.size >= file.size) return null;
    return blob;
}

async function compressItemForExport(item, strategy, quality) {
    if (strategy === "svg") return compressSvgBlob(item.file);
    if (strategy === "raster") return compressImageBlob(item.file, quality);
    return null;
}

async function estimateCompressedSize(quality, requestToken, isStaleFn) {
    const compressible = await getCompressibleItems();
    const compressibleIds = new Set(compressible.map(c => c.item.id));
    const fixedBytes = images.reduce((sum, item) => {
        if (!item.file || compressibleIds.has(item.id)) return sum;
        return sum + item.file.size;
    }, 0);
    if (compressible.length === 0) {
        return {
            fixedBytes: fixedBytes,
            compressibleOriginalBytes: 0,
            compressibleEstimatedBytes: 0,
            sampleCount: 0,
            totalCompressible: 0
        };
    }
    const SAMPLE_SIZE = 12;
    const step = Math.max(1, Math.floor(compressible.length / SAMPLE_SIZE));
    const sample = [];
    for (let i = 0; i < compressible.length && sample.length < SAMPLE_SIZE; i += step) {
        sample.push(compressible[i]);
    }
    let sampleOriginal = 0;
    let sampleCompressed = 0;
    for (const {item: item, strategy: strategy} of sample) {
        if (isStaleFn(requestToken)) return null;
        try {
            const compressed = await compressItemForExport(item, strategy, quality);
            sampleOriginal += item.file.size;
            sampleCompressed += compressed ? compressed.size : item.file.size;
        } catch (err) {
            sampleOriginal += item.file.size;
            sampleCompressed += item.file.size;
        }
    }
    const ratio = sampleOriginal > 0 ? sampleCompressed / sampleOriginal : 1;
    const compressibleOriginalBytes = compressible.reduce((s, c) => s + c.item.file.size, 0);
    return {
        fixedBytes: fixedBytes,
        compressibleOriginalBytes: compressibleOriginalBytes,
        compressibleEstimatedBytes: Math.round(compressibleOriginalBytes * ratio),
        sampleCount: sample.length,
        totalCompressible: compressible.length
    };
}

function formatBytesHuman(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

async function buildSaveObject(compressionOverrides) {
    const fileParts = [];
    const imagesData = images.map(item => {
        const entry = {
            id: item.id,
            type: item.type || "image",
            name: item.name,
            crop: item.crop || null,
            naturalWidth: item.naturalWidth,
            naturalHeight: item.naturalHeight
        };
        if (item.type === "link") {
            entry.linkURL = item.linkURL;
            entry.youtubeId = item.youtubeId || null;
            return entry;
        }
        const override = compressionOverrides ? compressionOverrides.get(item.id) : null;
        if (override) {
            const isSvg = override.type === "image/svg+xml";
            const baseName = item.file && item.file.name ? item.file.name.replace(/\.[^.]+$/, "") : item.name;
            entry.fileName = baseName + (isSvg ? ".svg" : ".webp");
            entry.fileType = isSvg ? "image/svg+xml" : "image/webp";
            entry.fileByteLength = override.size;
            fileParts.push(override);
        } else if (item.file) {
            entry.fileName = item.file.name || item.name + (item.type === "audio" ? ".mp3" : ".jpg");
            entry.fileType = item.file.type || (item.type === "audio" ? "audio/mpeg" : "image/png");
            entry.fileByteLength = item.file.size;
            fileParts.push(item.file);
        }
        if (item.type === "audio" && item.coverFile) {
            entry.hasCover = true;
            entry.coverFileName = item.coverFile.name || item.name + "-cover.jpg";
            entry.coverFileType = item.coverFile.type || "image/jpeg";
            entry.coverByteLength = item.coverFile.size;
            fileParts.push(item.coverFile);
        } else {
            entry.hasCover = false;
        }
        return entry;
    });
    const header = {
        format: SAVE_FORMAT,
        version: SAVE_VERSION,
        savedAt: (new Date).toISOString(),
        resultsLayoutMode: resultsLayoutMode,
        screen: currentScreenName,
        images: imagesData,
        sort: {
            resultsVisible: currentScreenName === "sort" && resultsView.hidden === false,
            initialShuffledOrder: initialShuffledOrder,
            choiceLog: choiceLog.join(""),
            totalComparisons: totalComparisons,
            comparisonsDone: comparisonsDone
        }
    };
    return {
        header: header,
        fileParts: fileParts
    };
}

async function writeSaveFile(compressionOverrides) {
    const {header: header, fileParts: fileParts} = await buildSaveObject(compressionOverrides);
    const headerBytes = (new TextEncoder).encode(JSON.stringify(header));
    const magicBytes = (new TextEncoder).encode(SAVE_MAGIC);
    const lengthPrefix = new Uint8Array(4);
    new DataView(lengthPrefix.buffer).setUint32(0, headerBytes.byteLength, true);
    const blob = new Blob([ magicBytes, lengthPrefix, headerBytes, ...fileParts ], {
        type: "application/octet-stream"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = buildSaveFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2e3);
}

async function doSaveState() {
    try {
        await writeSaveFile(null);
    } catch (err) {
        console.error("[SORTER] Error while saving:", err);
        alert("Saving failed. The current state of the app has not been changed.\n\nDetail: " + (err && err.message ? err.message : err));
    }
}

function openSaveModal() {

saveQualitySlider.addEventListener("input", () => {

    clearTimeout(saveEstimateDebounce);
    saveEstimateDebounce = setTimeout(refreshSizeEstimate, 250);
});

async function refreshSizeEstimate() {
    const myToken = ++saveEstimateToken;
    const level = parseInt(saveQualitySlider.value, 10);
    const quality = Math.max(.05, 1 - level / 100 * .9);
    const result = await estimateCompressedSize(quality, myToken, token => token !== saveEstimateToken);
    if (!result || myToken !== saveEstimateToken) return;
    const totalOriginal = result.fixedBytes + result.compressibleOriginalBytes;
    const totalEstimated = result.fixedBytes + result.compressibleEstimatedBytes;
    const reductionPct = totalOriginal > 0 ? 100 * (1 - totalEstimated / totalOriginal) : 0;
    const sampleNote = result.totalCompressible > result.sampleCount ? `<div class="save-size-note">Estimated from a sample of ${result.sampleCount}/${result.totalCompressible} images, the exact result may vary slightly.</div>` : `<div class="save-size-note">Measured exactly (all ${result.totalCompressible} compressible images).</div>`;
    saveSizePreview.innerHTML = `\n        <div class="save-size-row"><span>Estimated size</span><strong>${formatBytesHuman(totalEstimated)}</strong></div>\n        <div class="save-size-row"><span>Reduction</span><strong>${reductionPct.toFixed(1)}%</strong></div>\n        ${result.fixedBytes > 0 ? `<div class="save-size-note">Audio and animated GIF files (${formatBytesHuman(result.fixedBytes)}) are kept at their original size, a real audio/GIF-animation re-encoder isn't implemented here. SVG and single-frame GIFs ARE compressed.</div>` : ""}\n        ${sampleNote}\n    `;
}

btnSaveModalConfirm.addEventListener("click", async () => {
    btnSaveModalConfirm.disabled = true;
    const originalLabel = btnSaveModalConfirm.textContent;
    try {
        let overrides = null;
        let compressFailures = 0;
        if (saveCompressToggle.checked) {
            const level = parseInt(saveQualitySlider.value, 10);
            const quality = Math.max(.05, 1 - level / 100 * .9);
            btnSaveModalConfirm.textContent = "Checking files…";
            const eligible = await getCompressibleItems();
            overrides = new Map;
            let done = 0;
            btnSaveModalConfirm.textContent = `Compressing… 0/${eligible.length}`;
            const COMPRESSION_CONCURRENCY = 4;
            await runWithConcurrency(eligible, COMPRESSION_CONCURRENCY, async ({item: item, strategy: strategy}) => {
                try {
                    const compressed = await compressItemForExport(item, strategy, quality);
                    if (compressed) overrides.set(item.id, compressed);
                } catch (err) {
                    console.error("[SORTER] Compression failed for", item.name, err);
                    compressFailures++;
                } finally {
                    done++;
                    btnSaveModalConfirm.textContent = `Compressing… ${done}/${eligible.length}`;
                }
            });
        }
        btnSaveModalConfirm.textContent = "Saving…";
        await writeSaveFile(overrides);
        closeSaveModal();
        if (compressFailures > 0) {
            alert(`Save complete. ${compressFailures} image(s) could not be compressed and were kept at their original size in the save (this never blocks the export).`);
        }
    } catch (err) {
        console.error("[SORTER] Error while saving:", err);
        alert("Saving failed. The current state of the app has not been changed.\n\nDetail: " + (err && err.message ? err.message : err));
    } finally {
        btnSaveModalConfirm.disabled = false;
        btnSaveModalConfirm.textContent = originalLabel;
    }
});

inputLoadSave.addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    importProgress.hidden = false;
    importProgressFill.style.width = "0%";
    importProgressLabel.textContent = "Reading save file…";
    try {
        let data;
        let fileProvider = null;
        const magicBytes = new Uint8Array(await file.slice(0, 4).arrayBuffer());
        const magicText = (new TextDecoder).decode(magicBytes);
        if (magicText === SAVE_MAGIC) {
            const lenBytes = new Uint8Array(await file.slice(4, 8).arrayBuffer());
            const headerLength = new DataView(lenBytes.buffer).getUint32(0, true);
            const headerText = await file.slice(8, 8 + headerLength).text();
            data = JSON.parse(headerText);
            let cursor = 8 + headerLength;
            const slices = new Map;
            (data.images || []).forEach(entry => {
                let main = null, cover = null;
                if (entry.type !== "link" && typeof entry.fileByteLength === "number") {
                    main = file.slice(cursor, cursor + entry.fileByteLength, entry.fileType);
                    cursor += entry.fileByteLength;
                }
                if (entry.hasCover && typeof entry.coverByteLength === "number") {
                    cover = file.slice(cursor, cursor + entry.coverByteLength, entry.coverFileType);
                    cursor += entry.coverByteLength;
                }
                slices.set(entry.id, {
                    main: main,
                    cover: cover
                });
            });
            fileProvider = id => slices.get(id) || {
                main: null,
                cover: null
            };
        } else {
            const text = await file.text();
            try {
                data = JSON.parse(text);
            } catch (parseErr) {
                throw new Error("The selected file is not a readable backup file (invalid JSON).");
            }
        }
        if (!data || typeof data !== "object") {
            throw new Error("The backup file is empty or corrupted.");
        }
        if (data.format !== SAVE_FORMAT) {
            throw new Error("This file is not a Sorter Maker backup.");
        }
        if (typeof data.version !== "number") {
            throw new Error("The backup format is invalid.");
        }
        if (data.version > SAVE_VERSION) {
            throw new Error("This backup was created using a newer version of Sorter Maker.");
        }
        if (!Array.isArray(data.images)) {
            throw new Error("The backup file is corrupted (image list is missing).");
        }
        if (!data.sort || typeof data.sort !== "object") {
            throw new Error("The backup file is corrupted (sort status missing).");
        }
        await restoreFromSave(data, fileProvider);
    } catch (err) {
        console.error("[SORTER] Error while loading the save file:", err);
        alert("Unable to load this file.\n\n" + (err && err.message ? err.message : "Invalid or corrupted file.") + "\n\nThe current status of the application has not changed.");
    } finally {
        importProgress.hidden = true;
    }
});

async function restoreFromSave(data, fileProvider) {
    const newImages = [];
    const newImagesById = new Map;
    for (const entry of data.images) {
        if (!entry || !entry.id) {
            throw new Error("A backup item is invalid.");
        }
        const type = entry.type || "image";
        let file = null;
        let coverFile = null;
        if (type === "link") {} else if (fileProvider) {
            const slice = fileProvider(entry.id);
            if (slice.main) {
                file = new File([ slice.main ], entry.fileName || (entry.name || type) + ".dat", {
                    type: entry.fileType || ""
                });
            }
            if (slice.cover) {
                coverFile = new File([ slice.cover ], entry.coverFileName || "cover.jpg", {
                    type: entry.coverFileType || "image/jpeg"
                });
            }
        } else {
            if (!entry.dataBase64) {
                throw new Error("A backup image is invalid.");
            }
            const buffer = base64ToArrayBuffer(entry.dataBase64);
            file = new File([ buffer ], entry.fileName || (entry.name || "image") + ".jpg", {
                type: entry.fileType || "image/png"
            });
        }
        const item = {
            id: entry.id,
            type: type,
            file: file,
            name: typeof entry.name === "string" ? entry.name : file ? nameFromFilename(file.name) : "Untitled",
            crop: entry.crop || null,
            naturalWidth: typeof entry.naturalWidth === "number" ? entry.naturalWidth : null,
            naturalHeight: typeof entry.naturalHeight === "number" ? entry.naturalHeight : null,
            thumbURL: null,
            audioURL: null,
            coverFile: coverFile,
            coverURL: null,
            linkURL: entry.linkURL || null,
            youtubeId: entry.youtubeId || null,
            directMediaType: entry.linkURL && !entry.youtubeId ? detectDirectMediaType(entry.linkURL) : null
        };
        newImages.push(item);
        newImagesById.set(item.id, item);
    }
    const imageItemsToThumbnail = [];
    for (const item of newImages) {
        if (item.type === "image") {
            imageItemsToThumbnail.push(item);
        } else if (item.type === "gif") {
            item.thumbURL = item.file ? URL.createObjectURL(item.file) : null;
        } else if (item.type === "audio") {
            item.audioURL = item.file ? URL.createObjectURL(item.file) : null;
            if (item.coverFile) item.coverURL = URL.createObjectURL(item.coverFile);
        } else if (item.type === "link") {
            if (item.youtubeId) {
                item.thumbURL = `https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg`;
            } else if (item.directMediaType === "image") {
                item.thumbURL = item.linkURL;
            } else if (item.directMediaType === "audio") {
                item.audioURL = item.linkURL;
            }
        }
    }
    const THUMBNAIL_CONCURRENCY = 6;
    let thumbDone = 0;
    if (imageItemsToThumbnail.length > 0) {
        importProgress.hidden = false;
        importProgressLabel.textContent = `Generating thumbnails… 0 / ${imageItemsToThumbnail.length}`;
        importProgressFill.style.width = "0%";
    }
    await runWithConcurrency(imageItemsToThumbnail, THUMBNAIL_CONCURRENCY, async item => {
        await generateThumbnail(item);
        thumbDone++;
        if (imageItemsToThumbnail.length > 0) {
            importProgressLabel.textContent = `Generating thumbnails… ${thumbDone} / ${imageItemsToThumbnail.length}`;
            importProgressFill.style.width = Math.round(thumbDone / imageItemsToThumbnail.length * 100) + "%";
        }
    });
    images.forEach(item => {
        revokeIfBlob(item.thumbURL);
        revokeIfBlob(item.audioURL);
        revokeIfBlob(item.coverURL);
    });
    clearMediaContainer(leftMedia);
    clearMediaContainer(rightMedia);
    images = newImages;
    imagesById.clear();
    newImagesById.forEach((value, key) => imagesById.set(key, value));
    const sort = data.sort || {};
    characters = images.map(item => ({
        id: item.id,
        name: item.name
    }));
    const charactersById = new Map(characters.map(c => [ c.id, c ]));
    if (Array.isArray(sort.initialShuffledOrder)) {
        initialShuffledOrder = sort.initialShuffledOrder.slice();
        totalComparisons = typeof sort.totalComparisons === "number" ? sort.totalComparisons : calculateMaximumComparisons(characters.length);
        if (initialShuffledOrder.length >= 2) {
            replaySortFromLog(initialShuffledOrder, sort.choiceLog || "", charactersById);
        } else {
            groups = [];
            currentMerge = null;
            history = [];
            choiceLog = [];
            tiedWithNext = new Set;
            comparisonsDone = 0;
        }
    } else {
        groups = Array.isArray(sort.groups) ? sort.groups.map(g => [ ...g ]) : [];
        currentMerge = sort.currentMerge ? {
            left: [ ...sort.currentMerge.left ],
            right: [ ...sort.currentMerge.right ],
            leftIndex: sort.currentMerge.leftIndex || 0,
            rightIndex: sort.currentMerge.rightIndex || 0,
            result: Array.isArray(sort.currentMerge.result) ? [ ...sort.currentMerge.result ] : []
        } : null;
        totalComparisons = typeof sort.totalComparisons === "number" ? sort.totalComparisons : 0;
        comparisonsDone = typeof sort.comparisonsDone === "number" ? sort.comparisonsDone : 0;
        tiedWithNext = new Set(Array.isArray(sort.tiedWithNext) ? sort.tiedWithNext : []);
        history = Array.isArray(sort.history) ? sort.history.map(h => ({
            groups: Array.isArray(h.groups) ? h.groups.map(g => [ ...g ]) : [],
            currentMerge: h.currentMerge ? {
                left: [ ...h.currentMerge.left ],
                right: [ ...h.currentMerge.right ],
                leftIndex: h.currentMerge.leftIndex || 0,
                rightIndex: h.currentMerge.rightIndex || 0,
                result: Array.isArray(h.currentMerge.result) ? [ ...h.currentMerge.result ] : []
            } : null,
            comparisonsDone: h.comparisonsDone || 0,
            tiedWithNext: new Set(Array.isArray(h.tiedWithNext) ? h.tiedWithNext : [])
        })) : [];
        initialShuffledOrder = groups.length ? groups.map(g => g[0].id) : characters.map(c => c.id);
        choiceLog = [];
    }
    resultsLayoutMode = data.resultsLayoutMode === "horizontal" ? "horizontal" : "vertical";
    updateCountLabel();
    refreshGridTotalHeight();
    renderVisibleCards();
    const targetScreen = data.screen === "sort" && characters.length >= 2 ? "sort" : "import";
    if (targetScreen === "sort") {
        tieButton.style.display = "inline-block";
        undoButton.style.display = "inline-block";
        battleEl.style.display = "grid";
        showScreen("sort");
        if (sort.resultsVisible && groups.length === 1) {
            battleView.hidden = true;
            displayResults(groups[0]);
            resultsView.hidden = false;
        } else if (currentMerge) {
            resultsView.hidden = true;
            battleView.hidden = false;
            await displayCurrentComparison();
        } else {
            resultsView.hidden = true;
            battleView.hidden = false;
            nextStep();
        }
    } else {
        showScreen("import");
    }
}

document.addEventListener("keydown", e => {
    if (currentScreenName !== "sort" || resultsView.hidden === false) return;
    if (e.key === "ArrowLeft") {
        e.preventDefault();
        choose("left");
    } else if (e.key === "ArrowRight") {
        e.preventDefault();
        choose("right");
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        choose("tie");
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        undo();
    }
});

const btnDarkMode = document.getElementById("btnDarkMode");

const btnDarkModeSort = document.getElementById("btnDarkModeSort");

function updateDarkModeButtons(enabled) {
    const text = enabled ? "Light" : "Dark";
    if (btnDarkMode) {
        btnDarkMode.textContent = text;
    }
    if (btnDarkModeSort) {
        btnDarkModeSort.textContent = text;
    }
}

function applyDarkMode(enabled) {
    document.documentElement.classList.toggle("dark", enabled);
    updateDarkModeButtons(enabled);
    localStorage.setItem("sorter-dark-mode", enabled ? "1" : "0");
}

function toggleDarkMode() {
    const enabled = !document.documentElement.classList.contains("dark");
    applyDarkMode(enabled);
}

if (btnDarkMode) {
    btnDarkMode.addEventListener("click", toggleDarkMode);
}

if (btnDarkModeSort) {
    btnDarkModeSort.addEventListener("click", toggleDarkMode);
}

function initDarkMode() {
    const saved = localStorage.getItem("sorter-dark-mode");
    if (saved === "1") {
        applyDarkMode(true);
    } else {
        applyDarkMode(false);
    }
}

initDarkMode();

const THEME_STORAGE_KEY = "sorter-maker-custom-theme";

const themeState = {
    bg: null,
    el: null
};

function clampPercent(n) {
    return Math.max(0, Math.min(100, Math.round(n)));
}

function clampHue(n) {
    let h = Math.round(n) % 360;
    if (h < 0) h += 360;
    return h;
}

function parseColorToHsl(colorStr) {
    let r, g, b;
    const str = (colorStr || "").trim();
    if (str.startsWith("#")) {
        const hex = str.replace("#", "");
        const full = hex.length === 3 ? hex.split("").map(c => c + c).join("") : hex;
        r = parseInt(full.substring(0, 2), 16);
        g = parseInt(full.substring(2, 4), 16);
        b = parseInt(full.substring(4, 6), 16);
    } else {
        const m = str.match(/rgba?\(([^)]+)\)/i);
        if (!m) return {
            h: 0,
            s: 0,
            l: 100
        };
        const parts = m[1].split(",").map(p => parseFloat(p.trim()));
        [r, g, b] = parts;
    }
    if (![ r, g, b ].every(Number.isFinite)) return {
        h: 0,
        s: 0,
        l: 100
    };
    r /= 255;
    g /= 255;
    b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
        const d = max - min;
        s = l > .5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;

          case g:
            h = (b - r) / d + 2;
            break;

          case b:
            h = (r - g) / d + 4;
            break;
        }
        h *= 60;
    }
    return {
        h: Math.round(h),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
    };
}

function themeToCss(t) {
    return `hsl(${t.h}, ${t.s}%, ${t.l}%)`;
}

function loadThemeState() {
    try {
        const raw = localStorage.getItem(THEME_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.bg && parsed.el) return parsed;
    } catch (err) {}
    return null;
}

function saveThemeState() {
    try {
        localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(themeState));
    } catch (err) {}
}

function applyThemeState() {
    if (!themeState.bg || !themeState.el) {
        document.documentElement.classList.remove("custom-theme");
        return;
    }
    document.documentElement.style.setProperty("--custom-bg", themeToCss(themeState.bg));
    document.documentElement.style.setProperty("--custom-element", themeToCss(themeState.el));
    document.documentElement.classList.add("custom-theme");
}

const themeBgHue = document.getElementById("themeBgHue");
const themeBgSat = document.getElementById("themeBgSat");
const themeBgLight = document.getElementById("themeBgLight");
const themeElHue = document.getElementById("themeElHue");
const themeElSat = document.getElementById("themeElSat");
const themeElLight = document.getElementById("themeElLight");

const themeOutputs = {
    bg: {
        h: document.getElementById("themeBgHueOut"),
        s: document.getElementById("themeBgSatOut"),
        l: document.getElementById("themeBgLightOut")
    },
    el: {
        h: document.getElementById("themeElHueOut"),
        s: document.getElementById("themeElSatOut"),
        l: document.getElementById("themeElLightOut")
    }
};

const themePreviewBg = document.getElementById("themePreviewBg");
const themePreviewEl = document.getElementById("themePreviewEl");

function refreshThemeUI() {
    themeBgHue.value = themeState.bg.h;
    themeBgSat.value = themeState.bg.s;
    themeBgLight.value = themeState.bg.l;
    themeElHue.value = themeState.el.h;
    themeElSat.value = themeState.el.s;
    themeElLight.value = themeState.el.l;
    themeOutputs.bg.h.textContent = themeState.bg.h + "°";
    themeOutputs.bg.s.textContent = themeState.bg.s + "%";
    themeOutputs.bg.l.textContent = themeState.bg.l + "%";
    themeOutputs.el.h.textContent = themeState.el.h + "°";
    themeOutputs.el.s.textContent = themeState.el.s + "%";
    themeOutputs.el.l.textContent = themeState.el.l + "%";
    themePreviewBg.style.background = themeToCss(themeState.bg);
    themePreviewEl.style.background = themeToCss(themeState.el);
}

function bindThemeSlider(el, group, key) {
    el.addEventListener("input", () => {
        themeState[group][key] = key === "h" ? clampHue(Number(el.value)) : clampPercent(Number(el.value));
        applyThemeState();
        refreshThemeUI();
        saveThemeState();
    });
}

bindThemeSlider(themeBgHue, "bg", "h");
bindThemeSlider(themeBgSat, "bg", "s");
bindThemeSlider(themeBgLight, "bg", "l");
bindThemeSlider(themeElHue, "el", "h");
bindThemeSlider(themeElSat, "el", "s");
bindThemeSlider(themeElLight, "el", "l");

const themeModal = document.getElementById("themeModal");
const btnThemeCustomize = document.getElementById("btnThemeCustomize");
const btnThemeClose = document.getElementById("btnThemeClose");
const btnThemeReset = document.getElementById("btnThemeReset");

function ensureThemeStateInitialized() {
    if (!themeState.bg) {
        const computedBg = getComputedStyle(document.documentElement).getPropertyValue("--bg") || "#f4f4f1";
        const hsl = parseColorToHsl(computedBg);
        themeState.bg = {
            h: hsl.h,
            s: hsl.s,
            l: hsl.l
        };
    }
    if (!themeState.el) {
        const computedEl = getComputedStyle(document.documentElement).getPropertyValue("--surface") || "#ffffff";
        const hsl = parseColorToHsl(computedEl);
        themeState.el = {
            h: hsl.h,
            s: hsl.s,
            l: hsl.l
        };
    }
}

function openThemeModal() {
    ensureThemeStateInitialized();
    refreshThemeUI();
    themeModal.hidden = false;
}

function closeThemeModal() {
    themeModal.hidden = true;
}

if (btnThemeCustomize) btnThemeCustomize.addEventListener("click", openThemeModal);

if (btnThemeClose) btnThemeClose.addEventListener("click", closeThemeModal);

if (btnThemeReset) {
    btnThemeReset.addEventListener("click", () => {
        themeState.bg = null;
        themeState.el = null;
        applyThemeState();
        saveThemeState();
        ensureThemeStateInitialized();
        refreshThemeUI();
    });
}

(function initThemeCustomization() {
    const stored = loadThemeState();
    if (stored) {
        themeState.bg = stored.bg;
        themeState.el = stored.el;
        applyThemeState();
    }
})();

updateCountLabel();

refreshGridTotalHeight();

renderVisibleCards();

applyResultsLayoutMode();

showScreen("import");
</script>
