// "#resultList .result-item:nth-child(1/2/3)" plus haut dans ce fichier
const RESULTS_PODIUM_GRADIENTS = {
    1: ["rgba(255, 215, 0, 0.5)", "rgba(184, 134, 11, 0.5)"],
    2: ["rgba(232, 232, 232, 0.5)", "rgba(140, 140, 140, 0.5)"],
    3: ["rgba(205, 127, 50, 0.2)", "rgba(139, 69, 19, 0.3)"]
};

function readComputedBox(el) {
    const cs = getComputedStyle(el);
    return {
        color: cs.color,
        backgroundColor: cs.backgroundColor,
        backgroundImage: cs.backgroundImage,
        borderColor: cs.borderTopColor,
        borderWidth: parseFloat(cs.borderTopWidth) || 0,
        borderRadius: parseFloat(cs.borderTopLeftRadius) || 0,
        fontSize: parseFloat(cs.fontSize) || 14,
        fontWeight: cs.fontWeight,
        fontFamily: cs.fontFamily,
        imageRendering: cs.imageRendering
    };
}

function drawRoundedRectPath(ctx, x, y, w, h, radius) {
    const r = Math.max(0, Math.min(radius, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawEllipsizedText(ctx, text, x, y, maxWidth) {
    if (!text) return;
    if (ctx.measureText(text).width <= maxWidth) {
        ctx.fillText(text, x, y);
        return;
    }
    const ellipsis = "…";
    let lo = 0, hi = text.length;
    while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        if (ctx.measureText(text.slice(0, mid) + ellipsis).width <= maxWidth) lo = mid;
        else hi = mid - 1;
    }
    ctx.fillText(text.slice(0, lo) + ellipsis, x, y);
}

function loadImageElement(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();

        if (!/^(blob:|data:)/.test(src)) {
            img.crossOrigin = "anonymous";
        }
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Failed to load an image for export: " + src));
        img.src = src;
    });
}

async function exportResultsAsPng() {
    const resultsPanelEl = document.querySelector("#resultsView .results");
    const listEl = document.getElementById("resultList");
    if (!resultsPanelEl || !listEl || !btnExportResultsPng) return;

    const items = Array.from(listEl.querySelectorAll(".result-item"));
    if (items.length === 0) {
        alert("There are no results to export yet.");
        return;
    }

    const originalLabel = btnExportResultsPng.textContent;
    btnExportResultsPng.disabled = true;
    btnExportResultsPng.textContent = "Exporting…";

    const prevScrollLeft = listEl.scrollLeft;
    const prevScrollTop = listEl.scrollTop;

    const hiddenExtras = [];
    items.forEach(item => {
        item.querySelectorAll(".result-audio-row, .result-link").forEach(extra => {
            hiddenExtras.push({ el: extra, display: extra.style.display });
            extra.style.display = "none";
        });
    });

    try {

        listEl.scrollLeft = 0;
        listEl.scrollTop = 0;

        const listRect = listEl.getBoundingClientRect();

        function relRect(el) {
            const r = el.getBoundingClientRect();
            return { x: r.left - listRect.left, y: r.top - listRect.top, w: r.width, h: r.height };
        }

        const itemData = items.map(item => {
            const rankEl = item.querySelector(".rank");
            const imgEl = item.querySelector(".result-thumb img");
            const placeholderEl = item.querySelector(".result-thumb-placeholder");
            const nameEl = item.querySelector(".result-name");
            const tieEl = nameEl ? nameEl.querySelector(".tie") : null;

            const nameText = nameEl
                ? Array.from(nameEl.childNodes)
                    .filter(n => n.nodeType === Node.TEXT_NODE)
                    .map(n => n.textContent)
                    .join("")
                    .trim()
                : "";

            return {
                rect: relRect(item),
                style: readComputedBox(item),
                isAudio: !!item.querySelector(".result-audio-row"),
                rank: rankEl ? { rect: relRect(rankEl), text: rankEl.textContent, style: readComputedBox(rankEl) } : null,
                img: imgEl ? { rect: relRect(imgEl), src: imgEl.src, style: readComputedBox(imgEl) } : null,

                placeholder: (!imgEl && placeholderEl) ? { rect: relRect(placeholderEl), text: placeholderEl.textContent, style: readComputedBox(placeholderEl) } : null,
                name: nameEl ? { rect: relRect(nameEl), text: nameText, style: readComputedBox(nameEl) } : null,
                tie: tieEl ? { rect: relRect(tieEl), text: tieEl.textContent, style: readComputedBox(tieEl) } : null
            };
        });

        const titleEl = resultsPanelEl.querySelector("h2");
        const titleText = titleEl ? titleEl.textContent.trim() : "";
        const titleStyle = titleEl ? readComputedBox(titleEl) : null;
        const titleBlockHeight = titleEl ? Math.round(titleStyle.fontSize * 1.3) + 20 : 0;

        const contentWidth = Math.ceil(Math.max(listRect.width, ...itemData.map(d => d.rect.x + d.rect.w)));
        const contentHeight = Math.ceil(Math.max(listRect.height, ...itemData.map(d => d.rect.y + d.rect.h)));

        listEl.scrollLeft = prevScrollLeft;
        listEl.scrollTop = prevScrollTop;

        const PADDING = 20;
        const totalWidth = contentWidth + PADDING * 2;
        const totalHeight = titleBlockHeight + contentHeight + PADDING * 2;

        const decodedImages = await Promise.all(itemData.map(d => {
            if (!d.img || !d.img.src) return Promise.resolve(null);
            return loadImageElement(d.img.src).catch(() => null);
        }));

        const scaleFactor = Math.max(2, window.devicePixelRatio || 1);

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(totalWidth * scaleFactor);
        canvas.height = Math.round(totalHeight * scaleFactor);

        const ctx = canvas.getContext("2d");
        ctx.scale(scaleFactor, scaleFactor);

        ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
        ctx.fillRect(0, 0, totalWidth, totalHeight);

        if (titleEl) {
            ctx.fillStyle = titleStyle.color;
            ctx.font = `${titleStyle.fontWeight} ${titleStyle.fontSize}px ${titleStyle.fontFamily}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(titleText, totalWidth / 2, PADDING + titleStyle.fontSize * 0.75);
        }

        const originX = PADDING;
        const originY = PADDING + titleBlockHeight;

        itemData.forEach((d, index) => {
            const x = originX + d.rect.x;
            const y = originY + d.rect.y;
            const w = d.rect.w;
            const h = d.rect.h;

            drawRoundedRectPath(ctx, x, y, w, h, d.style.borderRadius);

            if (index < 3) {
                const stops = RESULTS_PODIUM_GRADIENTS[index + 1];
                const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
                gradient.addColorStop(0, stops[0]);
                gradient.addColorStop(1, stops[1]);
                ctx.fillStyle = gradient;
            } else {
                let bg = d.style.backgroundColor;
                if (!bg || bg === "rgba(0, 0, 0, 0)" || bg === "transparent") {
                    bg = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#ffffff";
                }
                ctx.fillStyle = bg;
            }
            ctx.fill();

            if (d.style.borderWidth > 0) {
                ctx.lineWidth = d.style.borderWidth;
                ctx.strokeStyle = d.style.borderColor;
                ctx.stroke();
            }

            const img = decodedImages[index];
            if (img && d.img) {
                const ix = originX + d.img.rect.x;
                const iy = originY + d.img.rect.y;
                const iw = d.img.rect.w;
                const ih = d.img.rect.h;

                ctx.save();
                drawRoundedRectPath(ctx, ix, iy, iw, ih, d.img.style.borderRadius);
                ctx.clip();

                const pixelated = d.img.style.imageRendering === "pixelated" || d.img.style.imageRendering === "crisp-edges";
                ctx.imageSmoothingEnabled = !pixelated;
                ctx.imageSmoothingQuality = "high";

                const coverScale = Math.max(iw / img.naturalWidth, ih / img.naturalHeight);
                const dw = img.naturalWidth * coverScale;
                const dh = img.naturalHeight * coverScale;
                const dx = ix + (iw - dw) / 2;
                const dy = iy + (ih - dh) / 2;
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();

            } else {

                const ph = d.placeholder;
                if (ph && ph.rect) {
                    const px = originX + ph.rect.x + ph.rect.w / 2;
                    const py = originY + ph.rect.y + ph.rect.h / 2;
                    ctx.save();
                    ctx.fillStyle = ph.style.backgroundColor && ph.style.backgroundColor !== "rgba(0, 0, 0, 0)"
                        ? ph.style.backgroundColor
                        : (getComputedStyle(document.documentElement).getPropertyValue("--image-bg").trim() || "#eeeeee");
                    drawRoundedRectPath(ctx, originX + ph.rect.x, originY + ph.rect.y, ph.rect.w, ph.rect.h, 4);
                    ctx.fill();
                    ctx.font = `${ph.style.fontSize}px ${ph.style.fontFamily}`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(ph.text || "🎵", px, py);
                    ctx.restore();
                }
            }


            const audioIconRect = d.isAudio ? (d.img ? d.img.rect : (d.placeholder ? d.placeholder.rect : null)) : null;
            if (audioIconRect) {
                const ix = originX + audioIconRect.x;
                const iy = originY + audioIconRect.y;
                const iw = audioIconRect.w;
                const ih = audioIconRect.h;
                const barH = Math.max(10, Math.min(14, ih * 0.28));

                ctx.save();
                drawRoundedRectPath(ctx, ix, iy, iw, ih, 4);
                ctx.clip();

                ctx.fillStyle = "rgba(0,0,0,.55)";
                ctx.fillRect(ix, iy + ih - barH, iw, barH);

                const triSize = barH * 0.55;
                const triX = ix + 6;
                const triY = iy + ih - barH / 2;
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.moveTo(triX, triY - triSize / 2);
                ctx.lineTo(triX, triY + triSize / 2);
                ctx.lineTo(triX + triSize, triY);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // numro de classement
            if (d.rank && d.rank.rect) {
                ctx.fillStyle = d.rank.style.color;
                ctx.font = `${d.rank.style.fontWeight} ${d.rank.style.fontSize}px ${d.rank.style.fontFamily}`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(
                    d.rank.text,
                    originX + d.rank.rect.x + d.rank.rect.w / 2,
                    originY + d.rank.rect.y + d.rank.rect.h / 2
                );
            }

            // nom (+ mention degalite eventuelle en dessous)
            if (d.name && d.name.rect) {
                ctx.fillStyle = d.name.style.color;
                ctx.font = `${d.name.style.fontWeight} ${d.name.style.fontSize}px ${d.name.style.fontFamily}`;
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";

                const nameY = d.tie
                    ? originY + d.name.rect.y + d.name.rect.h * 0.35
                    : originY + d.name.rect.y + d.name.rect.h / 2;

                drawEllipsizedText(ctx, d.name.text, originX + d.name.rect.x, nameY, d.name.rect.w);

                if (d.tie && d.tie.rect) {
                    ctx.fillStyle = d.tie.style.color;
                    ctx.font = `${d.tie.style.fontWeight} ${d.tie.style.fontSize}px ${d.tie.style.fontFamily}`;
                    ctx.textAlign = "left";
                    ctx.textBaseline = "middle";
                    drawEllipsizedText(
                        ctx,
                        d.tie.text,
                        originX + d.tie.rect.x,
                        originY + d.tie.rect.y + d.tie.rect.h / 2,
                        d.tie.rect.w
                    );
                }
            }
        });

        const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (!pngBlob) throw new Error("PNG generation failed.");

        const downloadUrl = URL.createObjectURL(pngBlob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = buildResultsPngFilename();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 2000);

    } catch (err) {
        console.error("[SORTER] Erreur lors de l'export PNG des résultats :", err);
        alert("Unable to export the Results as a PNG image.\n\nDetail: " + (err && err.message ? err.message : err));

    } finally {

        listEl.scrollLeft = prevScrollLeft;
        listEl.scrollTop = prevScrollTop;

        hiddenExtras.forEach(({ el, display }) => { el.style.display = display; });

        btnExportResultsPng.disabled = false;
        btnExportResultsPng.textContent = originalLabel;
    }
}

if (btnExportResultsPng) {
    btnExportResultsPng.addEventListener("click", exportResultsAsPng);
}

function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
    }

    return btoa(binary);
}

function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const len = binary.length;
    const bytes = new Uint8Array(len);

    for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes.buffer;
}

function pad2(n) {
    return String(n).padStart(2, "0");
}

function buildSaveFilename() {
    const now = new Date();
    return `sorter-maker-${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.sorter-save`;
}

const SAVE_MAGIC = "SMB1";

async function isAnimatedGif(file) {
    try {
        const buffer = await file.arrayBuffer();
        const b = new Uint8Array(buffer);
        if (b.length < 13) return true;

        const packed = b[10];
        const gctFlag = (packed & 0x80) !== 0;
        const gctSize = gctFlag ? 3 * Math.pow(2, (packed & 0x07) + 1) : 0;
        let pos = 13 + gctSize;
        let frames = 0;

        function skipSubBlocks(p) {
            while (p < b.length) {
                const size = b[p];
                p += 1;
                if (size === 0) break;
                p += size;
            }
            return p;
        }

        while (pos < b.length) {
            const marker = b[pos];
            if (marker === 0x21) {
                pos += 2;
                pos = skipSubBlocks(pos);
            } else if (marker === 0x2C) {
                frames++;
                if (frames > 1) return true;
                const packedByte = b[pos + 9];
                const lctFlag = (packedByte & 0x80) !== 0;
                const lctSize = lctFlag ? 3 * Math.pow(2, (packedByte & 0x07) + 1) : 0;
                pos = pos + 10 + lctSize + 1; // + LZW min code size
                pos = skipSubBlocks(pos);
            } else {
                break; // trailer (0x3B) ou fin
            }
        }
        return frames > 1;
    } catch (err) {
        return true; // prudence
    }
}

async function getCompressionStrategy(item) {
    if (item._compressionStrategy !== undefined) return item._compressionStrategy;

    let strategy = null;
    if (item.type === "image" && item.file) {
        strategy = item.file.type === "image/svg+xml" ? "svg" : "raster";
    } else if (item.type === "gif" && item.file) {
        const animated = await isAnimatedGif(item.file);
        strategy = animated ? null : "raster";
    }

    item._compressionStrategy = strategy;
    return strategy;
}

async function getCompressibleItems() {
    const candidates = images.filter(it => it.file && (it.type === "image" || it.type === "gif"));
    const results = [];
    await runWithConcurrency(candidates, 8, async item => {
        const strategy = await getCompressionStrategy(item);
        if (strategy) results.push({ item, strategy });
    });
    return results;
}

async function compressImageBlob(file, quality) {
    return Promise.race([
        compressImageBlobInner(file, quality),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Compression timed out")), 20000))
    ]);
}

async function compressImageBlobInner(file, quality) {
    const drawable = await loadDrawable(file);
    try {
        const canvas = document.createElement("canvas");
        canvas.width = drawable.width;
        canvas.height = drawable.height;
        canvas.getContext("2d").drawImage(drawable.source, 0, 0);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/webp", quality));
        if (!blob || blob.size >= file.size) return null;
        return blob;
    } finally {
        drawable.close();
    }
}

function minifySvgText(text) {
    return text
        .replace(/<!--[\s\S]*?-->/g, "")
        .replace(/>\s+</g, "><")
        .replace(/\s{2,}/g, " ")
        .trim();
}

async function compressSvgBlob(file) {
    const text = await file.text();
    const minified = minifySvgText(text);
    if (!minified) return null;
    const blob = new Blob([minified], { type: "image/svg+xml" });
    if (blob.size >= file.size) return null;
    return blob;
}

async function compressItemForExport(item, strategy, quality) {
    if (strategy === "svg") return compressSvgBlob(item.file);
    if (strategy === "raster") return compressImageBlob(item.file, quality);
    return null;
}

async function estimateCompressedSize(quality, requestToken, isStaleFn) {
    const compressible = await getCompressibleItems();
    const compressibleIds = new Set(compressible.map(c => c.item.id));

    const fixedBytes = images.reduce((sum, item) => {
        if (!item.file || compressibleIds.has(item.id)) return sum;
        return sum + item.file.size;
    }, 0);

    if (compressible.length === 0) {
        return { fixedBytes, compressibleOriginalBytes: 0, compressibleEstimatedBytes: 0, sampleCount: 0, totalCompressible: 0 };
    }

    const SAMPLE_SIZE = 12;
    const step = Math.max(1, Math.floor(compressible.length / SAMPLE_SIZE));
    const sample = [];
    for (let i = 0; i < compressible.length && sample.length < SAMPLE_SIZE; i += step) {
        sample.push(compressible[i]);
    }

    let sampleOriginal = 0;
    let sampleCompressed = 0;

    for (const { item, strategy } of sample) {
        if (isStaleFn(requestToken)) return null; // un reglage plus recent a pris le relais
        try {
            const compressed = await compressItemForExport(item, strategy, quality);
            sampleOriginal += item.file.size;
            sampleCompressed += compressed ? compressed.size : item.file.size;
        } catch (err) {
            sampleOriginal += item.file.size;
            sampleCompressed += item.file.size;
        }
    }

    const ratio = sampleOriginal > 0 ? (sampleCompressed / sampleOriginal) : 1;
    const compressibleOriginalBytes = compressible.reduce((s, c) => s + c.item.file.size, 0);

    return {
        fixedBytes,
        compressibleOriginalBytes,
        compressibleEstimatedBytes: Math.round(compressibleOriginalBytes * ratio),
        sampleCount: sample.length,
        totalCompressible: compressible.length
    };
}

function formatBytesHuman(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

async function buildSaveObject(compressionOverrides) {
    const fileParts = [];

    const imagesData = images.map(item => {
        const entry = {
            id: item.id,
            type: item.type || "image",
            name: item.name,
            crop: item.crop || null,
            naturalWidth: item.naturalWidth,
            naturalHeight: item.naturalHeight
        };

        if (item.type === "link") {
            entry.linkURL = item.linkURL;
            entry.youtubeId = item.youtubeId || null;
            return entry;
        }

        const override = compressionOverrides ? compressionOverrides.get(item.id) : null;

        if (override) {
            const isSvg = override.type === "image/svg+xml";
            const baseName = item.file && item.file.name ? item.file.name.replace(/\.[^.]+$/, "") : item.name;
            entry.fileName = baseName + (isSvg ? ".svg" : ".webp");
            entry.fileType = isSvg ? "image/svg+xml" : "image/webp";
            entry.fileByteLength = override.size;
            fileParts.push(override);
        } else if (item.file) {
            entry.fileName = item.file.name || (item.name + (item.type === "audio" ? ".mp3" : ".jpg"));
            entry.fileType = item.file.type || (item.type === "audio" ? "audio/mpeg" : "image/png");
            entry.fileByteLength = item.file.size;
            fileParts.push(item.file);
        }

        if (item.type === "audio" && item.coverFile) {
            entry.hasCover = true;
            entry.coverFileName = item.coverFile.name || (item.name + "-cover.jpg");
            entry.coverFileType = item.coverFile.type || "image/jpeg";
            entry.coverByteLength = item.coverFile.size;
            fileParts.push(item.coverFile);
        } else {
            entry.hasCover = false;
        }

        return entry;
    });

    const header = {
        format: SAVE_FORMAT,
        version: SAVE_VERSION,
        savedAt: new Date().toISOString(),
        resultsLayoutMode: resultsLayoutMode,
        screen: currentScreenName,
        images: imagesData,
        sort: {
            resultsVisible: currentScreenName === "sort" && resultsView.hidden === false,
            initialShuffledOrder: initialShuffledOrder,
            choiceLog: choiceLog.join(""),
            totalComparisons: totalComparisons,
            comparisonsDone: comparisonsDone
        }
    };

    return { header, fileParts };
}

async function writeSaveFile(compressionOverrides) {
    const { header, fileParts } = await buildSaveObject(compressionOverrides);

    const headerBytes = new TextEncoder().encode(JSON.stringify(header));
    const magicBytes = new TextEncoder().encode(SAVE_MAGIC);

    const lengthPrefix = new Uint8Array(4);
    new DataView(lengthPrefix.buffer).setUint32(0, headerBytes.byteLength, true);

    const blob = new Blob([magicBytes, lengthPrefix, headerBytes, ...fileParts], { type: "application/octet-stream" });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = buildSaveFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function doSaveState() {
    try {
        await writeSaveFile(null);
    } catch (err) {
        console.error("[SORTER] Erreur lors de la sauvegarde :", err);
        alert("Saving failed. The current state of the app has not been changed.\n\nDetail: " + (err && err.message ? err.message : err));
    }
}

const saveModal = document.getElementById("saveModal");
const saveModalStats = document.getElementById("saveModalStats");
const saveCompressToggle = document.getElementById("saveCompressToggle");
const saveQualitySlider = document.getElementById("saveQualitySlider");
const saveQualityRow = document.getElementById("saveQualityRow");
const saveSizePreview = document.getElementById("saveSizePreview");
const btnSaveModalCancel = document.getElementById("btnSaveModalCancel");
const btnSaveModalConfirm = document.getElementById("btnSaveModalConfirm");

let saveEstimateToken = 0;

function openSaveModal() {
    const localImages = images.filter(it => it.type !== "link" && it.file);
    const remoteCount = images.filter(it => it.type === "link").length;
    const originalBytes = localImages.reduce((s, it) => s + it.file.size, 0);

    saveModalStats.innerHTML = `
        <div>Media: <strong>${images.length}</strong></div>
        <div>Remote links (never embedded): <strong>${remoteCount}</strong></div>
        <div>Local files: <strong>${localImages.length}</strong></div>
        <div>Original size of local files: <strong>${formatBytesHuman(originalBytes)}</strong></div>
    `;

    saveCompressToggle.checked = false;
    saveQualityRow.hidden = true;
    saveQualitySlider.value = "60";
    saveSizePreview.innerHTML = "";

    saveCompressToggle.disabled = true;
    saveCompressToggle.parentElement.title = "Checking compressible files…";

    saveModal.hidden = false;

    getCompressibleItems().then(compressible => {
        if (saveModal.hidden) return; // modale refermée entre-temps
        if (compressible.length === 0) {
            saveCompressToggle.disabled = true;
            saveCompressToggle.parentElement.title = "No compressible local files (JPG/PNG/WebP/SVG/single-frame GIF) in this sorter.";
        } else {
            saveCompressToggle.disabled = false;
            saveCompressToggle.parentElement.title = "";
        }
    });
}

function closeSaveModal() {
    saveModal.hidden = true;
}

btnSaveModalCancel.addEventListener("click", closeSaveModal);

saveCompressToggle.addEventListener("change", () => {
    saveQualityRow.hidden = !saveCompressToggle.checked;
    if (saveCompressToggle.checked) refreshSizeEstimate();
    else saveSizePreview.innerHTML = "";
});

let saveEstimateDebounce = null;
saveQualitySlider.addEventListener("input", () => {
    saveSizePreview.innerHTML = `<div class="save-size-computing">Computing estimate…</div>`;
    clearTimeout(saveEstimateDebounce);
    saveEstimateDebounce = setTimeout(refreshSizeEstimate, 250);
});

async function refreshSizeEstimate() {
    const myToken = ++saveEstimateToken;

    const level = parseInt(saveQualitySlider.value, 10);
    const quality = Math.max(0.05, 1 - (level / 100) * 0.9);

    const result = await estimateCompressedSize(quality, myToken, token => token !== saveEstimateToken);
    if (!result || myToken !== saveEstimateToken) return;

    const totalOriginal = result.fixedBytes + result.compressibleOriginalBytes;
    const totalEstimated = result.fixedBytes + result.compressibleEstimatedBytes;
    const reductionPct = totalOriginal > 0 ? (100 * (1 - totalEstimated / totalOriginal)) : 0;

    const sampleNote = result.totalCompressible > result.sampleCount
        ? `<div class="save-size-note">Estimated from a sample of ${result.sampleCount}/${result.totalCompressible} images — the exact result may vary slightly.</div>`
        : `<div class="save-size-note">Measured exactly (all ${result.totalCompressible} compressible images).</div>`;

    saveSizePreview.innerHTML = `
        <div class="save-size-row"><span>Estimated size</span><strong>${formatBytesHuman(totalEstimated)}</strong></div>
        <div class="save-size-row"><span>Reduction</span><strong>${reductionPct.toFixed(1)}%</strong></div>
        ${result.fixedBytes > 0 ? `<div class="save-size-note">Audio and animated GIF files (${formatBytesHuman(result.fixedBytes)}) are kept at their original size — a real audio/GIF-animation re-encoder isn't implemented here. SVG and single-frame GIFs ARE compressed.</div>` : ""}
        ${sampleNote}
    `;
}

btnSaveModalConfirm.addEventListener("click", async () => {
    btnSaveModalConfirm.disabled = true;
    const originalLabel = btnSaveModalConfirm.textContent;

    try {
        let overrides = null;
        let compressFailures = 0;

        if (saveCompressToggle.checked) {
            const level = parseInt(saveQualitySlider.value, 10);
            const quality = Math.max(0.05, 1 - (level / 100) * 0.9);

            btnSaveModalConfirm.textContent = "Checking files…";
            const eligible = await getCompressibleItems();

            overrides = new Map();
            let done = 0;
            btnSaveModalConfirm.textContent = `Compressing… 0/${eligible.length}`;

            // Compression EN PARALLÈLE (bornée) : avec des centaines/milliers
            // d'images, une boucle séquentielle pouvait donner l'impression
            // de blocage ou d'échec. Chaque échec individuel est isolé
            // (compté, journalisé) et n'interrompt jamais le reste : l'item
            // concerné gardera simplement son fichier original dans la
            // sauvegarde plutôt que de faire échouer tout l'export.
            const COMPRESSION_CONCURRENCY = 4;
            await runWithConcurrency(eligible, COMPRESSION_CONCURRENCY, async ({ item, strategy }) => {
                try {
                    const compressed = await compressItemForExport(item, strategy, quality);
                    if (compressed) overrides.set(item.id, compressed);
                } catch (err) {
                    console.error("[SORTER] Compression failed for", item.name, err);
                    compressFailures++;
                } finally {
                    done++;
                    btnSaveModalConfirm.textContent = `Compressing… ${done}/${eligible.length}`;
                }
            });
        }

        btnSaveModalConfirm.textContent = "Saving…";
        await writeSaveFile(overrides);
        closeSaveModal();

        if (compressFailures > 0) {
            alert(`Save complete. ${compressFailures} image(s) could not be compressed and were kept at their original size in the save (this never blocks the export).`);
        }

    } catch (err) {
        console.error("[SORTER] Erreur lors de la sauvegarde :", err);
        alert("Saving failed. The current state of the app has not been changed.\n\nDetail: " + (err && err.message ? err.message : err));
    } finally {
        btnSaveModalConfirm.disabled = false;
        btnSaveModalConfirm.textContent = originalLabel;
    }
});

function triggerLoadFile() {
    inputLoadSave.click();
}

if (btnSaveImport) btnSaveImport.addEventListener("click", openSaveModal);
if (btnSaveSort) btnSaveSort.addEventListener("click", openSaveModal);
if (btnLoadImport) btnLoadImport.addEventListener("click", triggerLoadFile);
if (btnLoadSort) btnLoadSort.addEventListener("click", triggerLoadFile);

inputLoadSave.addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = ""; // permet de recharger deux fois le meme fichier daffiler

    if (!file) return;

    importProgress.hidden = false;
    importProgressFill.style.width = "0%";
    importProgressLabel.textContent = "Reading save file…";

    try {
        let data;
        let fileProvider = null; // (id) -> { main: Blob|null, cover: Blob|null }

        const magicBytes = new Uint8Array(await file.slice(0, 4).arrayBuffer());
        const magicText = new TextDecoder().decode(magicBytes);

        if (magicText === SAVE_MAGIC) {
            // ---- Format binaire (v2+) ----
            const lenBytes = new Uint8Array(await file.slice(4, 8).arrayBuffer());
            const headerLength = new DataView(lenBytes.buffer).getUint32(0, true);

            const headerText = await file.slice(8, 8 + headerLength).text();
            data = JSON.parse(headerText);

            let cursor = 8 + headerLength;
            const slices = new Map();

            (data.images || []).forEach(entry => {
                let main = null, cover = null;

                if (entry.type !== "link" && typeof entry.fileByteLength === "number") {
                    main = file.slice(cursor, cursor + entry.fileByteLength, entry.fileType);
                    cursor += entry.fileByteLength;
                }
                if (entry.hasCover && typeof entry.coverByteLength === "number") {
                    cover = file.slice(cursor, cursor + entry.coverByteLength, entry.coverFileType);
                    cursor += entry.coverByteLength;
                }

                slices.set(entry.id, { main, cover });
            });

            fileProvider = id => slices.get(id) || { main: null, cover: null };

        } else {
            // ---- Format JSON hérité (v1, base64 inline) : reste lisible. ----
            const text = await file.text();
            try {
                data = JSON.parse(text);
            } catch (parseErr) {
                throw new Error("The selected file is not a readable backup file (invalid JSON).");
            }
        }

        if (!data || typeof data !== "object") {
            throw new Error("The backup file is empty or corrupted.");
        }
        if (data.format !== SAVE_FORMAT) {
            throw new Error("This file is not a Sorter Maker backup.");
        }
        if (typeof data.version !== "number") {
            throw new Error("The backup format is invalid.");
        }
        if (data.version > SAVE_VERSION) {
            throw new Error("This backup was created using a newer version of Sorter Maker.");
        }
        if (!Array.isArray(data.images)) {
            throw new Error("The backup file is corrupted (image list is missing).");
        }
        if (!data.sort || typeof data.sort !== "object") {
            throw new Error("The backup file is corrupted (sort status missing).");
        }

        await restoreFromSave(data, fileProvider);

    } catch (err) {
        console.error("[SORTER] Erreur lors du chargement de la sauvegarde :", err);
        alert("Unable to load this file.\n\n" + (err && err.message ? err.message : "Invalid or corrupted file.") + "\n\nThe current status of the application has not changed.");
    } finally {
        importProgress.hidden = true;
    }
});

async function restoreFromSave(data, fileProvider) {

    const newImages = [];
    const newImagesById = new Map();

    for (const entry of data.images) {
        if (!entry || !entry.id) {
            throw new Error("A backup item is invalid.");
        }

        const type = entry.type || "image";
        let file = null;
        let coverFile = null;

        if (type === "link") {
            // rien à charger : pas de fichier binaire pour un lien.

        } else if (fileProvider) {
            // Format binaire : les Blob ont déjà été découpés par tranche
            // (File.slice), sans jamais charger tout le fichier en mémoire.
            const slice = fileProvider(entry.id);
            if (slice.main) {
                file = new File([slice.main], entry.fileName || ((entry.name || type) + ".dat"), { type: entry.fileType || "" });
            }
            if (slice.cover) {
                coverFile = new File([slice.cover], entry.coverFileName || "cover.jpg", { type: entry.coverFileType || "image/jpeg" });
            }

        } else {
            // Format hérité v1 (base64 inline) — uniquement des images.
            if (!entry.dataBase64) {
                throw new Error("A backup image is invalid.");
            }
            const buffer = base64ToArrayBuffer(entry.dataBase64);
            file = new File(
                [buffer],
                entry.fileName || ((entry.name || "image") + ".jpg"),
                { type: entry.fileType || "image/png" }
            );
        }

        const item = {
            id: entry.id,
            type: type,
            file: file,
            name: typeof entry.name === "string" ? entry.name : (file ? nameFromFilename(file.name) : "Untitled"),
            crop: entry.crop || null,
            naturalWidth: typeof entry.naturalWidth === "number" ? entry.naturalWidth : null,
            naturalHeight: typeof entry.naturalHeight === "number" ? entry.naturalHeight : null,
            thumbURL: null,
            audioURL: null,
            coverFile: coverFile,
            coverURL: null,
            linkURL: entry.linkURL || null,
            youtubeId: entry.youtubeId || null,
            directMediaType: entry.linkURL && !entry.youtubeId ? detectDirectMediaType(entry.linkURL) : null
        };

        newImages.push(item);
        newImagesById.set(item.id, item);
    }

    // Les gif/audio/lien sont immédiats (juste une URL, pas de décodage) :
    // traités directement. Seules les images "classiques" nécessitent un
    // vrai décodage/miniature — c'est la partie coûteuse avec beaucoup de
    // fichiers, donc la seule qu'on parallélise (au lieu d'un
    // "await" séquentiel item par item, qui était le principal facteur de
    // lenteur du Load).
    const imageItemsToThumbnail = [];

    for (const item of newImages) {
        if (item.type === "image") {
            imageItemsToThumbnail.push(item);
        } else if (item.type === "gif") {
            item.thumbURL = item.file ? URL.createObjectURL(item.file) : null;
        } else if (item.type === "audio") {
            item.audioURL = item.file ? URL.createObjectURL(item.file) : null;
            if (item.coverFile) item.coverURL = URL.createObjectURL(item.coverFile);
        } else if (item.type === "link") {
            if (item.youtubeId) {
                item.thumbURL = `https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg`;
            } else if (item.directMediaType === "image") {
                item.thumbURL = item.linkURL;
            } else if (item.directMediaType === "audio") {
                item.audioURL = item.linkURL;
            }

        }
    }

    const THUMBNAIL_CONCURRENCY = 6;
    let thumbDone = 0;
    if (imageItemsToThumbnail.length > 0) {
        importProgress.hidden = false;
        importProgressLabel.textContent = `Generating thumbnails… 0 / ${imageItemsToThumbnail.length}`;
        importProgressFill.style.width = "0%";
    }
    await runWithConcurrency(imageItemsToThumbnail, THUMBNAIL_CONCURRENCY, async item => {
        await generateThumbnail(item);
        thumbDone++;
        if (imageItemsToThumbnail.length > 0) {
            importProgressLabel.textContent = `Generating thumbnails… ${thumbDone} / ${imageItemsToThumbnail.length}`;
            importProgressFill.style.width = Math.round((thumbDone / imageItemsToThumbnail.length) * 100) + "%";
        }
    });

    images.forEach(item => {
        revokeIfBlob(item.thumbURL);
        revokeIfBlob(item.audioURL);
        revokeIfBlob(item.coverURL);
    });
    clearMediaContainer(leftMedia);
    clearMediaContainer(rightMedia);

    images = newImages;
    imagesById.clear();
    newImagesById.forEach((value, key) => imagesById.set(key, value));

    const sort = data.sort || {};

    characters = images.map(item => ({ id: item.id, name: item.name }));
    const charactersById = new Map(characters.map(c => [c.id, c]));

    if (Array.isArray(sort.initialShuffledOrder)) {
        initialShuffledOrder = sort.initialShuffledOrder.slice();
        totalComparisons = typeof sort.totalComparisons === "number"
            ? sort.totalComparisons
            : calculateMaximumComparisons(characters.length);

        if (initialShuffledOrder.length >= 2) {
            replaySortFromLog(initialShuffledOrder, sort.choiceLog || "", charactersById);
        } else {
            groups = [];
            currentMerge = null;
            history = [];
            choiceLog = [];
            tiedWithNext = new Set();
            comparisonsDone = 0;
        }

    } else {

        groups = Array.isArray(sort.groups) ? sort.groups.map(g => [...g]) : [];
        currentMerge = sort.currentMerge ? {
            left: [...sort.currentMerge.left],
            right: [...sort.currentMerge.right],
            leftIndex: sort.currentMerge.leftIndex || 0,
            rightIndex: sort.currentMerge.rightIndex || 0,
            result: Array.isArray(sort.currentMerge.result) ? [...sort.currentMerge.result] : []
        } : null;
        totalComparisons = typeof sort.totalComparisons === "number" ? sort.totalComparisons : 0;
        comparisonsDone = typeof sort.comparisonsDone === "number" ? sort.comparisonsDone : 0;
        tiedWithNext = new Set(Array.isArray(sort.tiedWithNext) ? sort.tiedWithNext : []);
        history = Array.isArray(sort.history) ? sort.history.map(h => ({
            groups: Array.isArray(h.groups) ? h.groups.map(g => [...g]) : [],
            currentMerge: h.currentMerge ? {
                left: [...h.currentMerge.left],
                right: [...h.currentMerge.right],
                leftIndex: h.currentMerge.leftIndex || 0,
                rightIndex: h.currentMerge.rightIndex || 0,
                result: Array.isArray(h.currentMerge.result) ? [...h.currentMerge.result] : []
            } : null,
            comparisonsDone: h.comparisonsDone || 0,
            tiedWithNext: new Set(Array.isArray(h.tiedWithNext) ? h.tiedWithNext : [])
        })) : [];

        initialShuffledOrder = groups.length ? groups.map(g => g[0].id) : characters.map(c => c.id);
        choiceLog = [];
    }

    resultsLayoutMode = data.resultsLayoutMode === "horizontal" ? "horizontal" : "vertical";

    updateCountLabel();
    refreshGridTotalHeight();
    renderVisibleCards();

    const targetScreen = (data.screen === "sort" && characters.length >= 2) ? "sort" : "import";

    if (targetScreen === "sort") {
        tieButton.style.display = "inline-block";
        undoButton.style.display = "inline-block";
        battleEl.style.display = "grid";

        showScreen("sort");

        if (sort.resultsVisible && groups.length === 1) {
            battleView.hidden = true;
            displayResults(groups[0]);
            resultsView.hidden = false;

        } else if (currentMerge) {
            resultsView.hidden = true;
            battleView.hidden = false;
            await displayCurrentComparison();

        } else {

            resultsView.hidden = true;
            battleView.hidden = false;
            nextStep();
        }

    } else {
        showScreen("import");
    }
}

/* les raccourcis clavier*/

document.addEventListener("keydown", e => {
    if (currentScreenName !== "sort" || resultsView.hidden === false) return;

    if (e.key === "ArrowLeft") { e.preventDefault(); choose("left"); }
    else if (e.key === "ArrowRight") { e.preventDefault(); choose("right"); }
    else if (e.key === "ArrowUp") { e.preventDefault(); choose("tie"); }
    else if (e.key === "ArrowDown") { e.preventDefault(); undo(); }
});

/* dark mode*/

const btnDarkMode = document.getElementById("btnDarkMode");
const btnDarkModeSort = document.getElementById("btnDarkModeSort");

function updateDarkModeButtons(enabled) {

    const text = enabled
        ? "Light"
        : "Dark";

    if (btnDarkMode) {
        btnDarkMode.textContent = text;
    }

    if (btnDarkModeSort) {
        btnDarkModeSort.textContent = text;
    }
}

function applyDarkMode(enabled) {

    document.documentElement.classList.toggle("dark", enabled);

    updateDarkModeButtons(enabled);

    localStorage.setItem(
        "sorter-dark-mode",
        enabled ? "1" : "0"
    );
}

function toggleDarkMode() {

    const enabled =
        !document.documentElement.classList.contains("dark");

    applyDarkMode(enabled);
}

if (btnDarkMode) {
    btnDarkMode.addEventListener("click", toggleDarkMode);
}

if (btnDarkModeSort) {
    btnDarkModeSort.addEventListener("click", toggleDarkMode);
}

function initDarkMode() {

    const saved = localStorage.getItem("sorter-dark-mode");

    if (saved === "1") {
        applyDarkMode(true);
    } else {
        applyDarkMode(false);
    }
}

initDarkMode();


/* init*/

updateCountLabel();
refreshGridTotalHeight();
renderVisibleCards();
applyResultsLayoutMode();
showScreen("import");

</script>
