<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorter Maker</title>

<style>
    :root {
        --bg: #f4f4f1;
        --surface: #ffffff;
        --border: #dcdcd6;
        --ink: #1d1d1f;
        --muted: #6b6b68;
        --accent: #9c2b34;
        --accent-dark: #7c1f27;
        --gold: #c99a2e;
        --danger: #b3372c;
        --radius: 8px;
		--bg-secondary: #efefe9;
		--surface-hover: #f7f7f3;
			--border-strong: #b9b9b2;
		--input-bg: #ffffff;
		--image-bg: #eeeeeb;
    }

	html.dark {
		--bg: #171716;
		--surface: #242422;
		--border: #3a3a37;
		--ink: #eeeeea;
		--muted: #a4a49e;
		--accent: #c94a55;
		--accent-dark: #a93640;
		--gold: #d8aa3b;
		--danger: #e05a4f;

		--bg-secondary: #20201e;
		--surface-hover: #2d2d2a;
		--border-strong: #555550;
		--input-bg: #242422;
		--image-bg: #30302d;
	}

	html.dark body {
		background: var(--bg);
		color: var(--ink);
	}

	html.dark button {
		background: var(--surface);
		border-color: var(--border-strong);
		color: var(--ink);
	}

	html.dark button:hover {
		background: var(--surface-hover);
	}

	html.dark button.primary {
		background: var(--accent);
		border-color: var(--accent-dark);
		color: #fff;
	}

	html.dark button.primary:hover {
		background: var(--accent-dark);
	}

	html.dark .import-zone {
		background: var(--surface);
		border-color: #555550;
	}

	html.dark .import-zone.drag-over {
		border-color: var(--accent);
		background: #302022;
	}

	html.dark .grid-viewport {
		background: var(--bg-secondary);
		border-color: var(--border);
	}

	html.dark .card {
		background: var(--surface);
		border-color: var(--border);
	}

	html.dark .card-thumb {
		background: var(--image-bg);
	}

	html.dark .card-name {
		color: var(--ink);
	}

	html.dark .choice {
		background: var(--surface);
		border-color: #555550;
	}

	html.dark .choice:hover {
		border-color: var(--accent);
		box-shadow: 0 3px 10px rgba(0,0,0,.35);
	}

	html.dark .choice img {
		background: var(--image-bg);
	}

	html.dark .result-item:not(.podium-1):not(.podium-2):not(.podium-3) {
		background: var(--surface);
		border-color: #555550;
	}

	html.dark .progress {
		background: #111110;
		border-color: #666660;
	}

	html.dark .modal {
		background: rgba(0,0,0,.72);
	}

	html.dark .modal-box {
		background: var(--surface);
		color: var(--ink);
	}

	html.dark .crop-stage-outer {
		background: #111;
	}

	html.dark #cropPreviewCanvas {
		background: var(--image-bg);
	}

	html.dark .btn-danger:hover {
		background: #3a2220;
	}

	html.dark .ratio-buttons button.active {
		background: var(--accent);
		border-color: var(--accent-dark);
	}

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
    }

    button {
        font-family: inherit;
        font-size: 14px;
        padding: 9px 16px;
        border: 1px solid #b9b9b2;
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        transition: background .12s, border-color .12s, transform .08s;
    }

    button:hover { background: #efefe9; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    button.primary {
        background: var(--accent);
        border-color: var(--accent-dark);
        color: #fff;
        font-weight: 600;
    }
    button.primary:hover { background: var(--accent-dark); }

    button.btn-mini {
        padding: 5px 10px;
        font-size: 12.5px;
    }

    button.btn-danger:hover {
        background: #fbeceb;
        border-color: var(--danger);
        color: var(--danger);
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .screen { width: 100%; }
    .screen[hidden] { display: none; }

    

    #screenImport {
		max-width: 1200px;
		margin: 0 auto;
		padding: 24px 20px 40px;
		display: flex;
		flex-direction: column;
		min-height: 100vh;
	}

    .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
    }

    .topbar h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -.02em;
    }

    .topbar .tagline {
        color: var(--muted);
        font-size: 14px;
    }

    .import-zone {
        border: 2px dashed #c3c3ba;
        border-radius: var(--radius);
        background: var(--surface);
        padding: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        transition: border-color .15s, background .15s;
    }

    .import-zone.drag-over {
        border-color: var(--accent);
        background: #fbeeee;
    }

    .import-zone .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
    }

    .import-progress {
        margin-top: 12px;
    }

    .progress {
        width: 100%;
        height: 16px;
        border: 1px solid #222;
        background: white;
        padding: 2px;
        border-radius: 4px;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        background: var(--gold);
        transition: width .12s ease;
        border-radius: 2px;
    }

    #importProgressLabel {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
    }

    .grid-viewport {
        position: relative;
        flex: 1;
        margin-top: 16px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #efefe9;
        min-height: 200px;
    }

    .grid-sizer {
        position: relative;
        width: 100%;
    }

    .grid-inner {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), 1fr);
        gap: 14px;
        padding: 14px;
        box-sizing: border-box;
    }

    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .card-thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #e2e2db;
        overflow: hidden;
    }

    .card-thumb img {
		width: 100%;
		height: 100%;
		object-fit: contain;
		display: block;
		image-rendering: pixelated;
		image-rendering: crisp-edges;
	}

    .remote-media-wrap {
        width: 100%;
        height: 100%;
    }

    .card.is-cropped .card-thumb::after {
        content: "cropped";
        position: absolute;
        bottom: 4px;
        right: 4px;
        background: rgba(0,0,0,.6);
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        letter-spacing: .02em;
    }

    .card-name {
        border: none;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid transparent;
        padding: 7px 8px;
        font-size: 13px;
        font-weight: 600;
        width: 100%;
        background: transparent;
        color: var(--ink);
    }

    .card-name:focus {
        border-bottom: 1px solid var(--accent);
        outline: none;
    }

    .card-actions {
        display: flex;
        gap: 6px;
        padding: 0 8px 8px;
    }

    .card-actions button { flex: 1; padding: 6px 4px; }

    .empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
    }
    .empty-state[hidden] { display: none; }

    .launch-bar {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    #countLabel { color: var(--muted); font-size: 14px; }

    

    #screenSort {
		width: 100%;
		max-width: 1200px;
		min-height: 100vh;
		margin: 0 auto;
		padding: 24px 20px 40px;
		text-align: center;
	}

	#battleView {
		width: 100%;
		margin: 0;
		padding: 0;
	}

	.battle {
		display: grid;
		grid-template-columns: 1fr 80px 1fr;
		gap: 15px;
		align-items: center;
		width: 100%;
		max-width: 900px;
		margin: 0 auto;
	}
	
	#screenSort[hidden] {
		display: none !important;
	}

    .sort-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 10px;
		margin-bottom: 6px;
		flex-wrap: wrap;
	}

	.sort-header-right {
		display: flex;
		align-items: center;
		gap: 8px;
		flex-wrap: wrap;
	}

    #screenSort h1 { margin-bottom: 4px; }

    .subtitle { color: var(--muted); margin-bottom: 20px; }

    .progress-container { width: min(600px, 100%); margin: 0 auto 25px; }
    .progress-label { margin-bottom: 6px; font-size: 14px; color: var(--muted); }

    .battle {
		display: grid;
		grid-template-columns: 1fr 80px 1fr;
		gap: 15px;
		align-items: center;
		width: 100%;
		max-width: 900px;
		margin: 0 auto;
	}

    .choice {
		background: var(--surface);
		border: 2px solid #aaa;
		border-radius: 8px;
		padding: 12px;
		cursor: pointer;
		transition: border-color .15s, transform .15s, box-shadow .15s;
		min-width: 0;
	}

    .choice:hover {
        border-color: var(--accent);
        transform: scale(1.02);
        box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    
    .choice.choice-has-audio:hover {
        transform: none;
    }

    .choice img {
    display: block;
    width: 100%;
    height: 340px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    background: #eee;
    border-radius: 4px;
    transition: opacity .12s;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

    .choice img.is-loading { opacity: .25; }

    .choice-name {
		max-width: 100%;
		overflow: hidden;
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 3;
		line-clamp: 3;
		white-space: normal;
		overflow-wrap: break-word;

		font-family: "Trebuchet MS", Arial, sans-serif;
		font-weight: 600;
		line-height: 1.2;
	}

    .vs { font-size: 20px; font-weight: bold; color: #777; }

    .controls { margin-top: 20px; }

    .keyboard-hint {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--muted);
    }

    

    .results { margin: 30px auto 0; width: min(600px, 100%); text-align: left; }
    .results h2 { text-align: center; margin-bottom: 20px; }

    .results.layout-horizontal { width: 100%; max-width: 100%; }

    .results-toolbar {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    
    #resultList.horizontal {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(15, auto);
        grid-auto-columns: 300px;
        gap: 5px;
        overflow-x: auto;
        padding-bottom: 12px;
    }

    #resultList.horizontal .result-item {
        margin-bottom: 0;
        width: 300px;
    }

    .result-item {
        display: grid;
        grid-template-columns: 50px 70px 1fr;
        align-items: center;
        min-height: 70px;
        margin-bottom: 5px;
        padding: 5px;
        background: var(--surface);
        border: 1px solid #aaa;
        border-radius: 4px;
    }

    .result-item:nth-child(1) .rank { color: var(--gold); }

    .rank { text-align: center; font-size: 18px; font-weight: bold; }
    .result-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .result-name {
        display: block;
        padding-left: 12px;
        font-weight: bold;
        font-family: inherit;
        color: var(--ink);
        background: transparent;
        border: none;
        border-bottom: 1px solid transparent;
        outline: none;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
    }
    .result-name:hover,
    .result-name:focus {
        border-bottom-color: var(--accent);
    }
    .result-name:focus {
        text-overflow: clip;
        white-space: normal;
    }
	#resultList .result-name {
		font-size: 14px;
	}

    .tie {
        display: block;
        grid-column: 2 / -1;
        color: #888;
        font-size: 11.5px;
        font-weight: normal;
        margin-top: -2px;
    }

    .results-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
    }

    

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(20,20,20,.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }
    .modal[hidden] { display: none; }

    .modal-box {
        background: var(--surface);
        border-radius: 10px;
        max-width: 960px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .modal-box h2 { margin: 0; font-size: 18px; }

    .crop-body {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .crop-stage-outer {
        background: #262626;
        border-radius: 6px;
        padding: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
    }

    #cropStage {
        position: relative;
        overflow: hidden;
        touch-action: none;
        line-height: 0;
    }

    #cropCanvas { display: block; }

    .crop-rect {
        position: absolute;
        border: 2px solid var(--gold);
        box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
        cursor: move;
    }

    .crop-handle {
        position: absolute;
        width: 14px;
        height: 14px;
        background: var(--gold);
        border: 2px solid #fff;
        border-radius: 50%;
    }
    .crop-handle.nw { left: -8px; top: -8px; cursor: nwse-resize; }
    .crop-handle.ne { right: -8px; top: -8px; cursor: nesw-resize; }
    .crop-handle.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
    .crop-handle.se { right: -8px; bottom: -8px; cursor: nwse-resize; }

    .crop-side-panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 190px;
        flex: 1;
    }

    .crop-side-panel h3 {
        margin: 0 0 6px;
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--muted);
    }

    .ratio-buttons { display: flex; flex-wrap: wrap; gap: 6px; }

    .ratio-buttons button.active {
        background: var(--accent);
        border-color: var(--accent-dark);
        color: #fff;
    }

    #cropPreviewCanvas {
        background: #eee;
        border-radius: 6px;
        width: 100%;
        max-width: 190px;
        aspect-ratio: 1 / 1;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--border);
        padding-top: 14px;
    }

    

    .link-modal-box { max-width: 480px; }

    .save-stats {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        background: var(--image-bg);
        border-radius: 6px;
        padding: 10px 12px;
    }

    .save-compress-toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        cursor: pointer;
    }

    .save-slider-label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
    }

    #saveQualitySlider {
        width: 100%;
        accent-color: var(--accent);
    }

    .save-size-preview {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .save-size-row {
        display: flex;
        justify-content: space-between;
        font-size: 13.5px;
    }

    .save-size-note {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.4;
    }

    .save-size-computing {
        font-size: 12.5px;
        color: var(--muted);
        font-style: italic;
    }

    .link-form-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .link-form-row label {
        font-size: 12.5px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    .link-form-row input {
        font-family: inherit;
        font-size: 14px;
        padding: 9px 10px;
        border: 1px solid var(--border-strong, #b9b9b2);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--ink);
    }

    

    .card.type-gif .card-thumb::before {
        content: "GIF";
        position: absolute;
        top: 4px;
        left: 4px;
        background: rgba(0,0,0,.6);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 3px;
        letter-spacing: .04em;
        z-index: 2;
    }

    

    .audio-thumb-placeholder,
    .link-thumb-placeholder,
    .battle-media-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 40px;
        background: var(--image-bg);
        text-align: center;
        padding: 6px;
        box-sizing: border-box;
    }

    .battle-media-placeholder { font-size: 64px; }

    .media-probing {
        font-size: 22px;
        opacity: .7;
    }

    .media-unavailable-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
    }

    .media-retry-btn {
        font-size: 11px;
        padding: 3px 7px;
        border: 1px solid #999;
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
    }
    .media-retry-btn:hover { background: #eee; }

    .media-open-link {
        font-size: 11px;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
    }

    
    .card.type-audio,
    .card.type-audio .card-thumb {
        overflow: visible;
    }

    
    .card.type-audio .audio-cover-img {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        width: 100%;
        height: calc(100% - 42px);
        object-fit: cover;
        display: block;
    }

    .card.type-audio .audio-thumb-placeholder {
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        height: calc(100% - 42px);
    }

    

    .audio-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        background: #181818;
        border-radius: 0 0 8px 8px;
        z-index: 2;
    }

    .audio-bar audio { display: none; }

    .audio-play-btn {
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .audio-play-btn:hover { background: #303030; }

    .audio-time {
        flex: 0 0 auto;
        min-width: 55px;
        color: #999;
        font-size: 9px;
        text-align: center;
        white-space: nowrap;
        user-select: none;
    }

    .audio-progress {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
    }

    .audio-progress-track {
        position: relative;
        width: 100%;
        height: 4px;
        background: #414141;
        border-radius: 10px;
    }

    .audio-progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 100%;
        background: #fff;
        border-radius: inherit;
    }

    .audio-progress-thumb {
        position: absolute;
        left: 0;
        top: 50%;
        width: 9px;
        height: 9px;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity .12s;
    }

    .audio-progress:hover .audio-progress-thumb { opacity: 1; }

    .audio-volume {
        position: relative;
        flex: 0 0 27px;
        width: 27px;
        height: 42px;

@keyframes resultEnterUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes resultEnterLeft {
    from { opacity: 0; transform: translateX(18px); }
    to   { opacity: 1; transform: translateX(0); }
}

@keyframes podiumEnter1 {
    0%   { opacity: 0; transform: translateY(30px) scale(.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes podiumEnter23 {
    0%   { opacity: 0; transform: translateY(18px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.result-item {
    animation: resultEnterUp .5s cubic-bezier(.16, 1, .3, 1) both;
}
.results.layout-horizontal .result-item {
    animation-name: resultEnterLeft;
}
.result-item.podium-1 {
    animation-name: podiumEnter1;
    animation-duration: .78s;
    animation-timing-function: cubic-bezier(.16, 1, .3, 1);
}
.result-item.podium-2,
.result-item.podium-3 {
    animation-name: podiumEnter23;
    animation-duration: .56s;
    animation-timing-function: cubic-bezier(.16, 1, .3, 1);
}

.podium-divider {
    grid-column: 1 / -1;
    height: 1px;
    background: var(--border);
    margin: 4px 0 12px;
    animation: resultEnterUp .4s cubic-bezier(.16, 1, .3, 1) both;
}

@media (prefers-reduced-motion: reduce) {
    .result-item, .podium-divider {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
    }
}

<script>
function uid() {
    return "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function nameFromFilename(filename) {
    const dot = filename.lastIndexOf(".");
    return dot > 0 ? filename.slice(0, dot) : filename;
}

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}

function yieldToBrowser() {
    return new Promise(resolve => {
        if (window.requestIdleCallback) {
            requestIdleCallback(() => resolve(), {
                timeout: 100
            });
        } else {
            setTimeout(resolve, 0);
        }
    });
}

async function runWithConcurrency(items, limit, worker) {
    let cursor = 0;
    const effectiveLimit = Math.max(1, Math.min(limit, items.length));
    async function runOne() {
        while (cursor < items.length) {
            const index = cursor++;
            try {
                await worker(items[index], index);
            } catch (err) {
                console.error("[SORTER] Task failed:", err);
            }
        }
    }
    await Promise.all(new Array(effectiveLimit).fill(0).map(runOne));
}

async function loadDrawable(file) {
    if (window.createImageBitmap) {
        try {
            const bitmap = await createImageBitmap(file);
            return {
                source: bitmap,
                width: bitmap.width,
                height: bitmap.height,
                close() {
                    bitmap.close();
                }
            };
        } catch (err) {}
    }
    const objectUrl = URL.createObjectURL(file);
    try {
        const imgEl = await new Promise((resolve, reject) => {
            const el = new Image;
            el.onload = () => resolve(el);
            el.onerror = reject;
            el.src = objectUrl;
        });
        return {
            source: imgEl,
            width: imgEl.naturalWidth,
            height: imgEl.naturalHeight,
            close() {
                URL.revokeObjectURL(objectUrl);
            }
        };
    } catch (err) {
        URL.revokeObjectURL(objectUrl);
        throw err;
    }
}

function renderToBlobURL(drawable, cropRect, maxDim, quality) {
    const sx = cropRect ? cropRect.x : 0;
    const sy = cropRect ? cropRect.y : 0;
    const sw = cropRect ? cropRect.w : drawable.width;
    const sh = cropRect ? cropRect.h : drawable.height;
    const scale = Math.min(1, maxDim / Math.max(sw, sh));
    const dw = Math.max(1, Math.round(sw * scale));
    const dh = Math.max(1, Math.round(sh * scale));
    const canvas = document.createElement("canvas");
    canvas.width = dw;
    canvas.height = dh;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(drawable.source, sx, sy, sw, sh, 0, 0, dw, dh);
    return new Promise(resolve => {
        canvas.toBlob(blob => {
            resolve({
                blob: blob,
                url: URL.createObjectURL(blob),
                width: dw,
                height: dh
            });
        }, "image/png");
    });
}

async function renderItemToURL(item, maxDim, quality) {
    const drawable = await loadDrawable(item.file);
    try {

            const raw = await fetchViaProxy(buildProxyUrl(oembedUrl));
            if (!raw) throw new Error("no text");
            let data = null;
            try {
                data = JSON.parse(raw);
            } catch (err) {}
            if (data && typeof data.contents === "string") {
                try {
                    data = JSON.parse(data.contents);
                } catch (err) {
                    data = null;
                }
            }
            if (!data || !data.title) throw new Error("no title");
            return data.title;
        });
    });
    const title = await raceSources(sources, TITLE_FETCH_TIMEOUT_MS, "title");
    return title ? decodeHtmlEntities(title) : null;
}

}

async function importYoutubePlaylist(playlistId, startIndex, fallback) {
    fallback = fallback || {};
    importProgress.hidden = false;
    importProgressLabel.textContent = "Fetching playlist…";
    importProgressFill.style.width = "0%";
    const result = await fetchYoutubePlaylistVideos(playlistId);
    let videos = result.videos;
    const apiKeyError = result.apiKeyError;
    if (!videos || videos.length === 0) {
        importProgress.hidden = true;
        let reason;
        if (apiKeyError) {
            reason = `Your YouTube API key failed: "${apiKeyError.message}". ${describeYoutubeApiKeyError(apiKeyError.reason, apiKeyError.message)}`;
        } else {
            reason = "The playlist proxy isn't set up yet and the free fallback methods this uses are currently unreliable. Click \"YouTube API key\" to configure a playlist proxy URL or a personal API key.";
        }
        if (fallback.videoId && isValidYoutubeId(fallback.videoId)) {
            const fallbackUrl = `https://www.youtube.com/watch?v=${fallback.videoId}`;
            const fallbackItem = createLinkItem(fallback.name || null, fallbackUrl);
            if (!fallback.name) applyAutoYoutubeTitle(fallbackItem, fallbackUrl);
            updateCountLabel();
            refreshGridTotalHeight();
            renderVisibleCards();
            alert(`Couldn't fetch this playlist right now. ${reason} Only this one video was added. Try again in a moment, or open the browser console (F12) to see the detailed errors.`);
        } else {
            alert(`Couldn't fetch this playlist right now. ${reason} Try again in a moment, or open the browser console (F12) to see the detailed errors.`);
        }
        return;
    }
    if (startIndex > 1 && startIndex <= videos.length) {
        videos = videos.slice(startIndex - 1);
    }
    let created = 0;
    videos.forEach(({id: id, title: title}) => {
        if (!isValidYoutubeId(id)) return;
        const videoUrl = `https://www.youtube.com/watch?v=${id}`;
        const newItem = createLinkItem(title || null, videoUrl);
        if (!title) applyAutoYoutubeTitle(newItem, videoUrl);
        created++;
        importProgressLabel.textContent = `Adding videos… ${created} / ${videos.length}`;
        importProgressFill.style.width = Math.round(created / videos.length * 100) + "%";
    });
    importProgress.hidden = true;
    updateCountLabel();
    refreshGridTotalHeight();
    renderVisibleCards();
}

function nameFromUrl(url) {
    try {
        const u = new URL(url);
        const last = u.pathname.split("/").filter(Boolean).pop();
        if (!last) return url;
        const withoutExt = nameFromFilename(decodeURIComponent(last));
        const spaced = withoutExt.replace(/[_-]+/g, " ").trim();
        if (!spaced) return url;
        return spaced.charAt(0).toUpperCase() + spaced.slice(1);
    } catch (err) {
        return url;
    }
}

const LINK_FILE_HEADER = "SORTER-MAKER-LINKS|1";

const LINK_FILE_OPEN = "{#€@(";

const LINK_FILE_CLOSE = ")@€#}";

function pad2LinkFile(n) {
    return String(n).padStart(2, "0");
}

function buildLinkFileFilename() {
    const now = new Date;
    return `sorter-maker-links-${now.getFullYear()}${pad2LinkFile(now.getMonth() + 1)}${pad2LinkFile(now.getDate())}-${pad2LinkFile(now.getHours())}${pad2LinkFile(now.getMinutes())}.txt`;
}

function exportLinkFile() {
    const entries = images.filter(item => item.type === "link" && item.linkURL);
    if (entries.length === 0) {
        alert("No link-based media to export yet. Add a link first (or import media whose source is a remote URL).");
        return;
    }
    const lines = [ LINK_FILE_HEADER, "" ];
    entries.forEach(item => {
        const safeName = (item.name || "Untitled").split(LINK_FILE_OPEN).join("").split(LINK_FILE_CLOSE).join("");
        lines.push(`${safeName}${LINK_FILE_OPEN}${item.linkURL}${LINK_FILE_CLOSE}`);
    });
    const blob = new Blob([ lines.join("\n") ], {
        type: "text/plain;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = buildLinkFileFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2e3);
}

function parseLinkFileText(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return [];
    let startIndex = 0;
    if (lines[0].startsWith("SORTER-MAKER-LINKS")) {
        startIndex = 1;
    }
    const results = [];
    for (let i = startIndex; i < lines.length; i++) {
        const line = lines[i];
        const openIdx = line.indexOf(LINK_FILE_OPEN);
        const closeIdx = line.lastIndexOf(LINK_FILE_CLOSE);
        if (openIdx !== -1 && closeIdx !== -1 && closeIdx > openIdx) {
            const name = line.slice(0, openIdx).trim();
            const url = line.slice(openIdx + LINK_FILE_OPEN.length, closeIdx).trim();
            if (url) results.push({
                name: name || null,
                url: url
            });
        } else if (/^https?:\/\//i.test(line)) {
            results.push({
                name: null,
                url: line
            });
        }
    }
    return results;
}

async function importLinkFile(file) {
    let text;
    try {

    } catch (err) {
        alert("Unable to read this file.");
        return;
    }
    const entries = parseLinkFileText(text);
    if (entries.length === 0) {
        alert('No links found in this file. Expected format: SORTER-MAKER-LINKS|1 header followed by "Name{#€@(URL)@€#}" lines (or a plain list of URLs).');
        return;
    }
    entries.forEach(entry => {
        createLinkItem(entry.name || nameFromUrl(entry.url), entry.url);
    });
    updateCountLabel();
    refreshGridTotalHeight();
    renderVisibleCards();
}

        if (item.thumbURL) URL.revokeObjectURL(item.thumbURL);
        item.thumbURL = rendered.url;
    } finally {
        drawable.close();
    }
}

importZone.addEventListener("drop", async e => {

    importZone.classList.remove("drag-over");
    const dtItems = e.dataTransfer.items;
    if (dtItems && dtItems.length && dtItems[0].webkitGetAsEntry) {
        const entries = Array.from(dtItems).map(it => it.webkitGetAsEntry()).filter(Boolean);
        const files = await collectFilesFromEntries(entries);
        importFiles(files);
    } else {
        importFiles(e.dataTransfer.files);
    }
});

function collectFilesFromEntries(entries) {
    return new Promise(resolve => {
        const files = [];
        let pending = 0;
        let scanStarted = false;
        function checkDone() {
            if (scanStarted && pending === 0) resolve(files);
        }
        function walk(entry) {
            if (!entry) return;
            if (entry.isFile) {
                pending++;
                entry.file(file => {
                    files.push(file);
                    pending--;
                    checkDone();
                }, () => {
                    pending--;
                    checkDone();
                });
            } else if (entry.isDirectory) {
                pending++;
                const reader = entry.createReader();
                const readBatch = () => {
                    reader.readEntries(batch => {
                        if (batch.length === 0) {
                            pending--;
                            checkDone();
                            return;
                        }
                        batch.forEach(walk);
                        readBatch();
                    }, () => {
                        pending--;
                        checkDone();
                    });
                };
                readBatch();
            }
        }
        entries.forEach(walk);
        scanStarted = true;
        checkDone();
    });
}

function updateImportProgress(done, total) {
    const pct = total > 0 ? Math.round(done / total * 100) : 100;
    importProgressFill.style.width = pct + "%";

}

async function importFiles(fileList) {
    const files = Array.from(fileList).filter(f => isImageFile(f) || isAudioFile(f));
    if (files.length === 0) return;
    importProgress.hidden = false;
    let done = 0;
    const total = files.length;
    updateImportProgress(done, total);
    const BATCH_SIZE = 15;
    for (let i = 0; i < files.length; i += BATCH_SIZE) {
        const batch = files.slice(i, i + BATCH_SIZE);
        await Promise.all(batch.map(async file => {
            const item = createItemForFile(file);
            try {
                await processNewItem(item);
            } catch (err) {
                console.error("Invalid file format:", file.name, err);
                removeImageItem(item.id);
            }
            done++;
        }));
        updateImportProgress(done, total);
        refreshGridTotalHeight();
        renderVisibleCards();
        updateCountLabel();
        await yieldToBrowser();
    }
    importProgress.hidden = true;
    updateCountLabel();
    refreshGridTotalHeight();
    renderVisibleCards();
}

const CARD_MIN_WIDTH = 168;

const CARD_GAP = 14;

const CARD_HEIGHT = 232;

const GRID_ROW_BUFFER = 2;

function computeColumns() {
    const w = gridViewport.clientWidth - CARD_GAP * 2;
    const cols = Math.floor((w + CARD_GAP) / (CARD_MIN_WIDTH + CARD_GAP));
    return Math.max(1, cols);
}

function refreshGridTotalHeight() {
    const cols = computeColumns();
    const rows = Math.ceil(images.length / cols);
    const totalHeight = rows > 0 ? rows * (CARD_HEIGHT + CARD_GAP) + CARD_GAP : 0;
    gridSizer.style.height = totalHeight + "px";
}

function renderVisibleCards() {
    const cols = computeColumns();
    const rowHeight = CARD_HEIGHT + CARD_GAP;
    const scrollTop = gridViewport.scrollTop;
    const viewportHeight = gridViewport.clientHeight;
    const firstRow = Math.max(0, Math.floor(scrollTop / rowHeight) - GRID_ROW_BUFFER);
    const lastRow = Math.ceil((scrollTop + viewportHeight) / rowHeight) + GRID_ROW_BUFFER;
    const startIndex = firstRow * cols;
    const endIndex = Math.min(images.length, (lastRow + 1) * cols);
    gridInner.style.setProperty("--cols", cols);
    gridInner.style.transform = `translateY(${CARD_GAP + firstRow * rowHeight}px)`;
    const frag = document.createDocumentFragment();
    for (let idx = startIndex; idx < endIndex; idx++) {
        const item = images[idx];
        if (item) frag.appendChild(buildCard(item));
    }
    gridInner.querySelectorAll("audio").forEach(audioEl => {
        try {
            audioEl.pause();
        } catch (err) {}
    });
    gridInner.innerHTML = "";
    gridInner.appendChild(frag);
    emptyState.hidden = images.length > 0;
}

    bar.appendChild(volumeWrap);
    let previousVolume = 1;
    function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${secs}`;
    }
    playBtn.addEventListener("click", async e => {
        e.stopPropagation();
        if (!audioEl.src) return;
        if (audioEl.paused) {
            try {
                await audioEl.play();
                playBtn.textContent = "⏸";
            } catch (err) {
                console.error("[SORTER] Audio playback failed:", err);
            }
        } else {
            audioEl.pause();
            playBtn.textContent = "▶";
        }
    });
    audioEl.addEventListener("loadedmetadata", () => {
        durationSpan.textContent = formatTime(audioEl.duration);
    });
    audioEl.addEventListener("timeupdate", () => {
        if (!audioEl.duration) return;
        const percent = audioEl.currentTime / audioEl.duration * 100;
        fill.style.width = percent + "%";
        thumbDot.style.left = percent + "%";
        currentTimeSpan.textContent = formatTime(audioEl.currentTime);
    });
    audioEl.addEventListener("ended", () => {
        playBtn.textContent = "▶";
    });
    audioEl.addEventListener("error", () => {
        playBtn.textContent = "⚠";
        playBtn.title = "Media unavailable";
        playBtn.disabled = true;
    });
    function setProgressFromClientX(clientX) {
        if (!audioEl.duration) return;
        const rect = progress.getBoundingClientRect();
        let position = (clientX - rect.left) / rect.width;
        position = Math.max(0, Math.min(1, position));
        audioEl.currentTime = position * audioEl.duration;
    }
    let dragging = false;
    progress.addEventListener("pointerdown", e => {
        e.stopPropagation();
        dragging = true;
        try {
            progress.setPointerCapture(e.pointerId);
        } catch (err) {}
        setProgressFromClientX(e.clientX);
    });
    progress.addEventListener("pointermove", e => {
        if (dragging) setProgressFromClientX(e.clientX);
    });
    progress.addEventListener("pointerup", e => {
        dragging = false;
        try {
            progress.releasePointerCapture(e.pointerId);
        } catch (err) {}
    });
    progress.addEventListener("pointercancel", () => {
        dragging = false;
    });
    volumeSlider.addEventListener("input", e => {
        e.stopPropagation();
        const value = Number(volumeSlider.value);
        audioEl.volume = value;
        if (value > 0) {
            previousVolume = value;
            audioEl.muted = false;
        } else {
            audioEl.muted = true;
        }
    });
    volumeBtn.addEventListener("click", e => {
        e.stopPropagation();

            audioEl.muted = false;
            const restored = previousVolume > 0 ? previousVolume : 1;
            audioEl.volume = restored;
            volumeSlider.value = String(restored);
        } else {
            previousVolume = audioEl.volume;
            audioEl.muted = true;
        }
    });

            volumeBtn.textContent = "🔇";
        } else if (audioEl.volume < .5) {
            volumeBtn.textContent = "🔉";

        }
        volumeSlider.value = String(audioEl.volume);
    });
    bar.addEventListener("click", e => e.stopPropagation());
    bar.addEventListener("mousedown", e => e.stopPropagation());
    bar.addEventListener("pointerdown", e => e.stopPropagation());
    return bar;
}

function renderLinkThumbAsync(item, container) {
    if (item.mediaProbeState === "image") {
        container.appendChild(buildRemoteImageEl(item));
        return;
    }
    if (item.mediaProbeState === "audio") {
        const placeholder = document.createElement("div");
        placeholder.className = "audio-thumb-placeholder";
        placeholder.textContent = "🎵";
        container.appendChild(placeholder);
        container.appendChild(createAudioPlayerBar(item));
        return;
    }
    if (item.mediaProbeState === "unavailable") {
        container.appendChild(buildUnavailablePlaceholder(item, "link-thumb-placeholder", () => {
            item.mediaProbeState = null;
            clearRemoteMediaProbeCache(item.linkURL);
            container.innerHTML = "";
            renderLinkThumbAsync(item, container);
        }));
        return;
    }
    const loading = document.createElement("div");
    loading.className = "link-thumb-placeholder media-probing";
    loading.textContent = "⏳";
    container.appendChild(loading);
    ensureLinkMediaResolved(item).then(() => {
        if (!container.isConnected || !container.contains(loading)) return;
        container.innerHTML = "";
        renderLinkThumbAsync(item, container);
    });
}

let cropState = null;

async function openCropEditor(id) {
    const item = imagesById.get(id);
    if (!item || item.type !== "image") return;
    cropModalTitle.textContent = `Recadrer « ${item.name} »`;
    cropModal.hidden = false;
    const drawable = await loadDrawable(item.file);
    const scale = Math.min(CROP_STAGE_MAX_W / drawable.width, CROP_STAGE_MAX_H / drawable.height, 1);
    const dispW = Math.round(drawable.width * scale);
    const dispH = Math.round(drawable.height * scale);
    cropStage.style.width = dispW + "px";
    cropStage.style.height = dispH + "px";
    cropCanvas.width = dispW;
    cropCanvas.height = dispH;
    cropCanvas.getContext("2d").drawImage(drawable.source, 0, 0, dispW, dispH);
    const rect = item.crop ? {
        x: item.crop.x * scale,
        y: item.crop.y * scale,
        w: item.crop.w * scale,
        h: item.crop.h * scale
    } : {
        x: 0,
        y: 0,
        w: dispW,
        h: dispH
    };
    cropState = {
        itemId: id,
        drawable: drawable,
        scale: scale,
        dispW: dispW,
        dispH: dispH,
        rect: rect,
        ratioLock: null
    };
    ratioButtons.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.ratio === "free"));
    updateCropRectStyle();
    updateCropPreview();
}

function closeCropEditor() {
    if (cropState) {
        cropState.drawable.close();
        cropState = null;
    }
    cropModal.hidden = true;
}

document.getElementById("btnCropCancel").addEventListener("click", closeCropEditor);

document.getElementById("btnCropReset").addEventListener("click", () => {
    if (!cropState) return;
    cropState.rect = {
        x: 0,
        y: 0,
        w: cropState.dispW,
        h: cropState.dispH
    };
    cropState.ratioLock = null;
    ratioButtons.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.ratio === "free"));
    updateCropRectStyle();
    updateCropPreview();
});

ratioButtons.addEventListener("click", e => {
    const btn = e.target.closest("button[data-ratio]");
    if (!btn || !cropState) return;
    ratioButtons.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (btn.dataset.ratio === "free") {
        cropState.ratioLock = null;
        return;
    }
    const [rw, rh] = btn.dataset.ratio.split(":").map(Number);
    cropState.ratioLock = rw / rh;
    const r = cropState.rect;
    let newW = r.w;
    let newH = newW / cropState.ratioLock;
    if (newH > cropState.dispH) {
        newH = cropState.dispH;
        newW = newH * cropState.ratioLock;
    }
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2;
    r.w = newW;
    r.h = newH;
    r.x = clamp(cx - newW / 2, 0, cropState.dispW - newW);
    r.y = clamp(cy - newH / 2, 0, cropState.dispH - newH);
    updateCropRectStyle();
    updateCropPreview();
});

function updateCropRectStyle() {
    const r = cropState.rect;
    cropRectEl.style.left = r.x + "px";
    cropRectEl.style.top = r.y + "px";
    cropRectEl.style.width = r.w + "px";
    cropRectEl.style.height = r.h + "px";
}

function updateCropPreview() {
    if (!cropState) return;
    const {rect: rect, scale: scale, drawable: drawable} = cropState;
    const sx = rect.x / scale;
    const sy = rect.y / scale;
    const sw = rect.w / scale;
    const sh = rect.h / scale;
    const ctx = cropPreviewCanvas.getContext("2d");
    const pw = cropPreviewCanvas.width;
    const ph = cropPreviewCanvas.height;
    ctx.fillStyle = "#e5e5e0";
    ctx.fillRect(0, 0, pw, ph);
    if (sw <= 0 || sh <= 0) return;
    const fit = Math.min(pw / sw, ph / sh);
    const dw = sw * fit;
    const dh = sh * fit;
    const dx = (pw - dw) / 2;
    const dy = (ph - dh) / 2;
    ctx.drawImage(drawable.source, sx, sy, sw, sh, dx, dy, dw, dh);
}

let cropDrag = null;

cropRectEl.addEventListener("pointerdown", e => {
    if (!cropState) return;
    const handle = e.target.dataset.handle;
    e.preventDefault();
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    cropDrag = {
        mode: handle ? "resize" : "move",
        handle: handle,
        startX: e.clientX,
        startY: e.clientY,
        startRect: {
            ...cropState.rect
        }
    };
});

document.addEventListener("pointermove", e => {
    if (!cropDrag || !cropState) return;
    const dx = e.clientX - cropDrag.startX;
    const dy = e.clientY - cropDrag.startY;
    const stageW = cropState.dispW;
    const stageH = cropState.dispH;
    const start = cropDrag.startRect;
    let r = {
        ...start
    };
    if (cropDrag.mode === "move") {
        r.x = clamp(start.x + dx, 0, stageW - start.w);
        r.y = clamp(start.y + dy, 0, stageH - start.h);
    } else {
        const MIN_SIZE = 24;
        let left = start.x, top = start.y, right = start.x + start.w, bottom = start.y + start.h;
        if (cropDrag.handle.includes("w")) left = clamp(start.x + dx, 0, right - MIN_SIZE);
        if (cropDrag.handle.includes("e")) right = clamp(start.x + start.w + dx, left + MIN_SIZE, stageW);
        if (cropDrag.handle.includes("n")) top = clamp(start.y + dy, 0, bottom - MIN_SIZE);
        if (cropDrag.handle.includes("s")) bottom = clamp(start.y + start.h + dy, top + MIN_SIZE, stageH);
        if (cropState.ratioLock) {
            let w = right - left;
            let h = w / cropState.ratioLock;
            if (cropDrag.handle.includes("n")) top = bottom - h; else bottom = top + h;
            if (top < 0) {
                top = 0;
                h = bottom - top;
                w = h * cropState.ratioLock;
                if (cropDrag.handle.includes("w")) left = right - w; else right = left + w;
            }
            if (bottom > stageH) {
                bottom = stageH;
                h = bottom - top;
                w = h * cropState.ratioLock;
                if (cropDrag.handle.includes("w")) left = right - w; else right = left + w;
            }
        }
        r = {
            x: left,
            y: top,
            w: right - left,
            h: bottom - top
        };
    }
    cropState.rect = r;
    updateCropRectStyle();
    updateCropPreview();
});

document.addEventListener("pointerup", () => {
    cropDrag = null;
});

document.getElementById("btnCropValidate").addEventListener("click", async () => {
    if (!cropState) return;
    const {itemId: itemId, drawable: drawable, scale: scale, rect: rect} = cropState;
    const item = imagesById.get(itemId);
    if (!item) {
        closeCropEditor();
        return;
    }
    const sx = Math.round(rect.x / scale);
    const sy = Math.round(rect.y / scale);
    const sw = Math.round(rect.w / scale);
    const sh = Math.round(rect.h / scale);
    const isFullImage = sx <= 0 && sy <= 0 && sw >= drawable.width - 1 && sh >= drawable.height - 1;
    item.crop = isFullImage ? null : {
        x: Math.max(0, sx),
        y: Math.max(0, sy),
        w: Math.min(sw, drawable.width - Math.max(0, sx)),
        h: Math.min(sh, drawable.height - Math.max(0, sy))
    };
    const rendered = await renderToBlobURL(drawable, item.crop, THUMB_MAX_DIM, .82);
    if (item.thumbURL) URL.revokeObjectURL(item.thumbURL);
    item.thumbURL = rendered.url;
    closeCropEditor();
    renderVisibleCards();
});

function startSorter() {
    console.log("[SORTER] start");
    stopAllPlayingAudio();
    characters = images.map(item => ({
        id: item.id,
        name: item.name
    }));
    if (characters.length < 2) {
        alert("You need at least 2 images to start.");
        return;
    }
    groups = characters.map(character => [ character ]);
    currentMerge = null;
    comparisonsDone = 0;
    history = [];

    tiedWithNext = new Set;
    totalComparisons = calculateMaximumComparisons(characters.length);
    shuffle(groups);
    initialShuffledOrder = groups.map(group => group[0].id);

    nextStep();
}

function calculateMaximumComparisons(n) {
    if (n <= 1) return 0;
    const queue = new Array(n).fill(1);
    let head = 0;
    let total = 0;
    while (queue.length - head > 1) {
        const a = queue[head++];
        const b = queue[head++];
        total += a + b - 1;
        queue.push(a + b);
    }
    return total;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [ array[j], array[i] ];
    }
}

function nextStep() {
    if (groups.length === 1) {
        finishSorter();
        return;
    }
    if (currentMerge === null) {
        const left = groups.shift();
        const right = groups.shift();
        currentMerge = {
            left: left,
            right: right,
            leftIndex: 0,
            rightIndex: 0,
            result: []
        };
    }
    displayCurrentComparison();
}

function clearMediaContainer(el) {
    const audioEl = el.querySelector("audio");
    if (audioEl) {
        audioEl.pause();
        audioEl.removeAttribute("src");
        audioEl.load();
    }
    el.querySelectorAll("img[data-blob-url]").forEach(img => {
        URL.revokeObjectURL(img.dataset.blobUrl);
    });
    el.innerHTML = "";
    el.classList.remove("choice-media-audio");
    const choiceEl = el.closest(".choice");
    if (choiceEl) choiceEl.classList.remove("choice-has-audio");
}

async function renderBattleMedia(mediaEl, item) {
    clearMediaContainer(mediaEl);
    if (!item) return;
    if (item.type === "image") {
        const img = document.createElement("img");
        img.className = "battle-media-img";
        img.alt = item.name;
        mediaEl.appendChild(img);
        try {
            const rendered = await renderItemToURL(item, BATTLE_MAX_DIM, .9);
            img.src = rendered.url;
            img.dataset.blobUrl = rendered.url;
        } catch (err) {
            console.error("[SORTER] Could not display the image:", item.name, err);
        }
    } else if (item.type === "gif") {
        const img = document.createElement("img");
        img.className = "battle-media-img";
        img.alt = item.name;
        img.src = item.thumbURL || (item.file ? URL.createObjectURL(item.file) : "");
        mediaEl.appendChild(img);
    } else if (item.type === "audio") {
        mediaEl.classList.add("choice-media-audio");
        const choiceEl = mediaEl.closest(".choice");
        if (choiceEl) choiceEl.classList.add("choice-has-audio");
        if (item.coverURL) {
            const img = document.createElement("img");
            img.className = "battle-media-img";
            img.alt = item.name;
            img.src = item.coverURL;
            mediaEl.appendChild(img);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "battle-media-placeholder";
            placeholder.textContent = "🎵";
            mediaEl.appendChild(placeholder);
        }
        mediaEl.appendChild(createAudioPlayerBar(item));
    } else if (item.type === "link") {
        if (item.youtubeId && isValidYoutubeId(item.youtubeId)) {
            mediaEl.appendChild(buildYoutubeThumbLink(item, "battle-play-badge", () => {
                embedYoutubeInline(mediaEl, item);
            }));
        } else {
            renderBattleLinkMedia(item, mediaEl);
        }
    }
}

function renderBattleLinkMedia(item, mediaEl) {
    if (item.mediaProbeState === "image") {
        const img = document.createElement("img");
        img.className = "battle-media-img";
        img.alt = item.name;
        img.src = item.thumbURL || item.linkURL;
        img.addEventListener("error", () => {
            item.mediaProbeState = "unavailable";
            mediaEl.innerHTML = "";
            renderBattleLinkMedia(item, mediaEl);
        }, {
            once: true
        });
        mediaEl.appendChild(img);
        return;
    }
    if (item.mediaProbeState === "audio") {
        mediaEl.classList.add("choice-media-audio");
        const choiceEl = mediaEl.closest(".choice");
        if (choiceEl) choiceEl.classList.add("choice-has-audio");
        const placeholder = document.createElement("div");
        placeholder.className = "battle-media-placeholder";
        placeholder.textContent = "🎵";
        mediaEl.appendChild(placeholder);
        mediaEl.appendChild(createAudioPlayerBar(item));
        return;
    }
    if (item.mediaProbeState === "unavailable") {
        mediaEl.appendChild(buildUnavailablePlaceholder(item, "battle-media-placeholder", () => {
            item.mediaProbeState = null;
            clearRemoteMediaProbeCache(item.linkURL);
            mediaEl.innerHTML = "";
            renderBattleLinkMedia(item, mediaEl);
        }));
        return;
    }
    const loading = document.createElement("div");
    loading.className = "battle-media-placeholder media-probing";
    loading.textContent = "⏳";
    mediaEl.appendChild(loading);
    ensureLinkMediaResolved(item).then(() => {
        if (!mediaEl.isConnected || !mediaEl.contains(loading)) return;
        mediaEl.innerHTML = "";
        renderBattleLinkMedia(item, mediaEl);
    });
}

async function displayCurrentComparison() {
    const merge = currentMerge;
    if (merge.leftIndex >= merge.left.length) {
        while (merge.rightIndex < merge.right.length) {
            merge.result.push(merge.right[merge.rightIndex++]);
        }
        finishMerge();
        return;
    }
    if (merge.rightIndex >= merge.right.length) {
        while (merge.leftIndex < merge.left.length) {
            merge.result.push(merge.left[merge.leftIndex++]);
        }
        finishMerge();
        return;
    }
    const leftChar = merge.left[merge.leftIndex];
    const rightChar = merge.right[merge.rightIndex];
    leftName.textContent = leftChar.name;
    rightName.textContent = rightChar.name;
    updateProgress();
    const leftItem = imagesById.get(leftChar.id);
    const rightItem = imagesById.get(rightChar.id);
    const myToken = ++battleRenderToken;
    isRenderingBattle = true;
    leftMedia.classList.add("is-loading");
    rightMedia.classList.add("is-loading");
    await Promise.all([ renderBattleMedia(leftMedia, leftItem), renderBattleMedia(rightMedia, rightItem) ]);
    if (myToken !== battleRenderToken) return;
    leftMedia.classList.remove("is-loading");
    rightMedia.classList.remove("is-loading");
    isRenderingBattle = false;
}

leftChoice.addEventListener("click", () => choose("left"));

rightChoice.addEventListener("click", () => choose("right"));

tieButton.addEventListener("click", () => choose("tie"));

function choiceCodeFor(choice) {
    return choice === "left" ? "L" : choice === "right" ? "R" : "T";
}

function applyChoiceCode(code) {
    const merge = currentMerge;
    const left = merge.left[merge.leftIndex];
    const right = merge.right[merge.rightIndex];
    if (code === "L") {
        merge.result.push(left);
        merge.leftIndex++;
    } else if (code === "R") {
        merge.result.push(right);
        merge.rightIndex++;
    } else if (code === "T") {
        merge.result.push(left);
        merge.result.push(right);
        tiedWithNext.add(left.id);
        merge.leftIndex++;
        merge.rightIndex++;
    }
    comparisonsDone++;
}

function choose(choice) {
    if (!currentMerge || isRenderingBattle) return;
    history.push(createStateSnapshot());
    choiceLog.push(choiceCodeFor(choice));
    applyChoiceCode(choiceCodeFor(choice));
    displayCurrentComparison();
}

function finishMerge() {
    groups.push(currentMerge.result);
    currentMerge = null;
    nextStep();
}

function createStateSnapshot() {
    return {
        groups: groups.map(group => [ ...group ]),
        currentMerge: currentMerge ? {
            left: [ ...currentMerge.left ],
            right: [ ...currentMerge.right ],
            leftIndex: currentMerge.leftIndex,
            rightIndex: currentMerge.rightIndex,
            result: [ ...currentMerge.result ]
        } : null,
        comparisonsDone: comparisonsDone,
        tiedWithNext: new Set(tiedWithNext)
    };
}

function headlessAdvance() {
    while (true) {
        if (currentMerge === null) {
            if (groups.length <= 1) return;
            const left = groups.shift();
            const right = groups.shift();
            currentMerge = {
                left: left,
                right: right,
                leftIndex: 0,
                rightIndex: 0,
                result: []
            };
        }
        const merge = currentMerge;
        if (merge.leftIndex >= merge.left.length) {
            while (merge.rightIndex < merge.right.length) {
                merge.result.push(merge.right[merge.rightIndex++]);
            }
            groups.push(merge.result);
            currentMerge = null;
            continue;
        }
        if (merge.rightIndex >= merge.right.length) {
            while (merge.leftIndex < merge.left.length) {
                merge.result.push(merge.left[merge.leftIndex++]);
            }
            groups.push(merge.result);
            currentMerge = null;
            continue;
        }
        return;
    }
}

function replaySortFromLog(orderIds, logString, charactersById) {
    groups = orderIds.map(id => charactersById.get(id)).filter(Boolean).map(character => [ character ]);
    currentMerge = null;
    history = [];
    tiedWithNext = new Set;
    comparisonsDone = 0;
    headlessAdvance();
    const codes = (logString || "").split("");
    for (const code of codes) {
        if (!currentMerge) break;
        history.push(createStateSnapshot());
        applyChoiceCode(code);
        headlessAdvance();
    }
    choiceLog = codes.slice(0, comparisonsDone);
}

undoButton.addEventListener("click", undo);

function undo() {
    if (history.length === 0 || isRenderingBattle) return;
    const state = history.pop();
    choiceLog.pop();
    groups = state.groups.map(group => [ ...group ]);
    currentMerge = state.currentMerge ? {
        left: [ ...state.currentMerge.left ],
        right: [ ...state.currentMerge.right ],
        leftIndex: state.currentMerge.leftIndex,
        rightIndex: state.currentMerge.rightIndex,
        result: [ ...state.currentMerge.result ]
    } : null;
    comparisonsDone = state.comparisonsDone;
    tiedWithNext = new Set(state.tiedWithNext);
    if (currentMerge === null) {
        nextStep();
    } else {
        displayCurrentComparison();
    }
}

function updateProgress() {
    if (totalComparisons <= 0) {
        progressFill.style.width = "100%";
        return;
    }
    const percentage = Math.min(100, comparisonsDone / totalComparisons * 100);
    progressFill.style.width = percentage + "%";
    progressLabel.textContent = `Comparaison ${comparisonsDone} / ${totalComparisons}`;
}

function finishSorter() {
    const finalRanking = groups[0];
    battleView.hidden = true;
    clearMediaContainer(leftMedia);
    clearMediaContainer(rightMedia);
    displayResults(finalRanking);
    resultsView.hidden = false;
}

            wrap.textContent = "🎵";

    } else if (item && item.type === "link") {
        renderResultLinkThumb(item, wrap);
    } else {
        const img = document.createElement("img");
        img.src = item ? item.thumbURL || "" : "";
        img.alt = character.name;
        wrap.appendChild(img);
    }
    return wrap;
}

function renderResultLinkThumb(item, wrap) {
    if (item.thumbURL) {
        const img = document.createElement("img");
        img.src = item.thumbURL;
        img.alt = item.name;
        img.addEventListener("error", () => {
            item.mediaProbeState = "unavailable";

            wrap.innerHTML = "";
            wrap.className = "result-thumb";
            renderResultLinkThumb(item, wrap);

        });

        return;

    if (item.mediaProbeState === "audio") {
        wrap.classList.add("result-thumb-placeholder");
        wrap.textContent = "🎵";
        return;
    }
    if (item.mediaProbeState === "unavailable") {
        wrap.classList.add("result-thumb-placeholder");
        wrap.textContent = "🔗";
        return;
    }
    wrap.classList.add("result-thumb-placeholder", "media-probing");
    wrap.textContent = "⏳";
    ensureLinkMediaResolved(item).then(() => {

const RESULT_STAGGER_STEP_MS = 35;

const RESULT_CASCADE_BUDGET_MS = 2200;

const PODIUM_STAGGER_MS = [ 0, 130, 200 ];

const PODIUM_BASE_DELAY_MS = 560;

function displayResults(ranking) {
    stopAllPlayingAudio();
    resultsPodium.innerHTML = "";
    resultList.innerHTML = "";
    let rank = 1;
    const restCount = Math.max(1, ranking.length - 3);
    const dynamicStep = Math.min(RESULT_STAGGER_STEP_MS, RESULT_CASCADE_BUDGET_MS / restCount);
    ranking.forEach((character, index) => {
        if (index > 0 && !tiedWithNext.has(ranking[index - 1].id)) {
            rank = index + 1;
        }
        const item = imagesById.get(character.id);
        const isPodium = index < 3;
        const el = document.createElement("div");
        el.className = "result-item" + (isPodium ? ` podium-${index + 1}` : "");
        const rankEl = document.createElement("div");
        rankEl.className = "rank";
        if (isPodium) {
            rankEl.textContent = rank >= 1 && rank <= 3 ? [ "🥇", "🥈", "🥉" ][rank - 1] : String(rank);
            rankEl.title = "Rank " + rank;
        } else {
            rankEl.textContent = rank;
        }
        const thumbEl = buildResultThumb(item, character);
        const nameEl = document.createElement("input");
        nameEl.type = "text";
        nameEl.className = "result-name" + (isPodium ? " is-podium-name" : "");
        nameEl.value = character.name;
        nameEl.title = character.name;
        nameEl.spellcheck = false;
        nameEl.addEventListener("input", () => {
            character.name = nameEl.value;
            if (item) item.name = nameEl.value;
            nameEl.title = nameEl.value;
        });
        nameEl.addEventListener("click", e => e.stopPropagation());
        el.appendChild(rankEl);
        el.appendChild(thumbEl);
        el.appendChild(nameEl);
        if (tiedWithNext.has(character.id)) {
            const tieEl = document.createElement("span");
            tieEl.className = "tie";
            tieEl.textContent = "tied with the next one";
            el.appendChild(tieEl);
        }
        appendResultControlsRow(item, el);
        if (isPodium) {
            el.style.animationDelay = PODIUM_STAGGER_MS[index] + "ms";
            resultsPodium.appendChild(el);
        } else {
            const delay = PODIUM_BASE_DELAY_MS + (index - 3) * dynamicStep;
            el.style.animationDelay = delay + "ms";
            resultList.appendChild(el);
        }
    });
    if (ranking.length > 3) {
        podiumDivider.hidden = false;
        podiumDivider.style.animationDelay = PODIUM_BASE_DELAY_MS + "ms";
    } else {
        podiumDivider.hidden = true;
    }
    applyResultsLayoutMode();
    fitResultNames();
}

function readComputedBox(el) {
    const cs = getComputedStyle(el);
    return {
        color: cs.color,
        backgroundColor: cs.backgroundColor,
        backgroundImage: cs.backgroundImage,
        borderColor: cs.borderTopColor,
        borderWidth: parseFloat(cs.borderTopWidth) || 0,
        borderRadius: parseFloat(cs.borderTopLeftRadius) || 0,
        fontSize: parseFloat(cs.fontSize) || 14,
        fontWeight: cs.fontWeight,
        fontFamily: cs.fontFamily,
        imageRendering: cs.imageRendering,
        textAlign: cs.textAlign
    };
}

function drawRoundedRectPath(ctx, x, y, w, h, radius) {
    const r = Math.max(0, Math.min(radius, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawEllipsizedText(ctx, text, x, y, maxWidth) {
    if (!text) return;
    if (ctx.measureText(text).width <= maxWidth) {
        ctx.fillText(text, x, y);
        return;
    }
    const ellipsis = "…";
    let lo = 0, hi = text.length;
    while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        if (ctx.measureText(text.slice(0, mid) + ellipsis).width <= maxWidth) lo = mid; else hi = mid - 1;
    }
    ctx.fillText(text.slice(0, lo) + ellipsis, x, y);
}

function loadImageElementFromSrc(src, useCrossOrigin) {
    return new Promise((resolve, reject) => {
        const img = new Image;
        if (useCrossOrigin) img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Failed to load an image for export: " + src));
        img.src = src;
    });
}

async function loadImageElement(src) {
    if (/^(blob:|data:)/.test(src)) {
        return loadImageElementFromSrc(src, false);
    }
    try {
        return await loadImageElementFromSrc(src, true);
    } catch (err) {
        for (const buildProxyUrl of OG_IMAGE_PROXIES) {
            try {
                return await loadImageElementFromSrc(buildProxyUrl(src), true);
            } catch (proxyErr) {}
        }
        throw new Error("Failed to load an image for export: " + src);
    }
}

        return;
    }

    btnExportResultsPng.disabled = true;
    btnExportResultsPng.textContent = "Exporting…";
    const prevScrollLeft = listEl.scrollLeft;
    const prevScrollTop = listEl.scrollTop;
    const hiddenExtras = [];
    items.forEach(item => {
        item.querySelectorAll(".result-audio-row, .result-link").forEach(extra => {
            hiddenExtras.push({
                el: extra,
                display: extra.style.display
            });
            extra.style.display = "none";
        });
    });
    try {
        listEl.scrollLeft = 0;
        listEl.scrollTop = 0;
        const listRect = resultsPanelEl.getBoundingClientRect();
        function relRect(el) {
            const r = el.getBoundingClientRect();
            return {
                x: r.left - listRect.left,
                y: r.top - listRect.top,
                w: r.width,
                h: r.height
            };
        }
        const itemData = items.map(item => {
            const rankEl = item.querySelector(".rank");
            const imgEl = item.querySelector(".result-thumb img");
            const placeholderEl = item.querySelector(".result-thumb-placeholder");
            const nameEl = item.querySelector(".result-name");
            const tieEl = item.querySelector(".tie");
            const nameText = nameEl ? String(nameEl.value !== undefined ? nameEl.value : nameEl.textContent).trim() : "";
            return {
                rect: relRect(item),
                style: readComputedBox(item),
                isAudio: !!item.querySelector(".result-audio-row"),
                rank: rankEl ? {
                    rect: relRect(rankEl),
                    text: rankEl.textContent,
                    style: readComputedBox(rankEl)
                } : null,
                img: imgEl ? {
                    rect: relRect(imgEl),
                    src: imgEl.src,
                    style: readComputedBox(imgEl)
                } : null,
                placeholder: !imgEl && placeholderEl ? {
                    rect: relRect(placeholderEl),
                    text: placeholderEl.textContent,
                    style: readComputedBox(placeholderEl)
                } : null,
                name: nameEl ? {
                    rect: relRect(nameEl),
                    text: nameText,
                    style: readComputedBox(nameEl)
                } : null,
                tie: tieEl ? {
                    rect: relRect(tieEl),
                    text: tieEl.textContent,
                    style: readComputedBox(tieEl)
                } : null
            };
        });
        const titleEl = resultsPanelEl.querySelector("h2");
        const titleText = titleEl ? titleEl.textContent.trim() : "";
        const titleStyle = titleEl ? readComputedBox(titleEl) : null;
        const titleRect = titleEl ? relRect(titleEl) : null;
        const contentWidth = Math.ceil(Math.max(listRect.width, titleRect ? titleRect.x + titleRect.w : 0, ...itemData.map(d => d.rect.x + d.rect.w)));
        const contentHeight = Math.ceil(Math.max(listRect.height, titleRect ? titleRect.y + titleRect.h : 0, ...itemData.map(d => d.rect.y + d.rect.h)));
        listEl.scrollLeft = prevScrollLeft;
        listEl.scrollTop = prevScrollTop;
        const PADDING = 20;
        const totalWidth = contentWidth + PADDING * 2;
        const totalHeight = contentHeight + PADDING * 2;
        const podiumItemData = itemData.slice(0, Math.min(3, itemData.length));
        if (podiumItemData.length > 0) {
            const groupLeft = Math.min(...podiumItemData.map(d => d.rect.x));
            const groupRight = Math.max(...podiumItemData.map(d => d.rect.x + d.rect.w));
            const shiftX = contentWidth / 2 - (groupLeft + groupRight) / 2;
            if (Math.abs(shiftX) > .5) {
                const shiftRect = rect => {
                    if (rect) rect.x += shiftX;
                };
                if (titleRect) titleRect.x += shiftX;
                podiumItemData.forEach(d => {
                    shiftRect(d.rect);
                    shiftRect(d.rank && d.rank.rect);
                    shiftRect(d.img && d.img.rect);
                    shiftRect(d.placeholder && d.placeholder.rect);
                    shiftRect(d.name && d.name.rect);
                    shiftRect(d.tie && d.tie.rect);
                });
            }
        }
        const decodedImages = await Promise.all(itemData.map(d => {
            if (!d.img || !d.img.src) return Promise.resolve(null);
            return loadImageElement(d.img.src).catch(() => null);
        }));
        const scaleFactor = Math.max(2, window.devicePixelRatio || 1);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(totalWidth * scaleFactor);
        canvas.height = Math.round(totalHeight * scaleFactor);
        const ctx = canvas.getContext("2d");
        ctx.scale(scaleFactor, scaleFactor);
        ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
        ctx.fillRect(0, 0, totalWidth, totalHeight);
        if (titleEl && titleRect) {
            ctx.fillStyle = titleStyle.color;
            ctx.font = `${titleStyle.fontWeight} ${titleStyle.fontSize}px ${titleStyle.fontFamily}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(titleText, PADDING + titleRect.x + titleRect.w / 2, PADDING + titleRect.y + titleRect.h / 2);
        }
        const originX = PADDING;
        const originY = PADDING;
        itemData.forEach((d, index) => {
            const x = originX + d.rect.x;
            const y = originY + d.rect.y;
            const w = d.rect.w;
            const h = d.rect.h;
            drawRoundedRectPath(ctx, x, y, w, h, d.style.borderRadius);
            if (index < 3) {
                const stops = RESULTS_PODIUM_GRADIENTS[index + 1];
                const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
                gradient.addColorStop(0, stops[0]);
                gradient.addColorStop(1, stops[1]);
                ctx.fillStyle = gradient;
            } else {
                let bg = d.style.backgroundColor;
                if (!bg || bg === "rgba(0, 0, 0, 0)" || bg === "transparent") {
                    bg = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#ffffff";
                }
                ctx.fillStyle = bg;
            }
            ctx.fill();
            if (d.style.borderWidth > 0) {
                ctx.lineWidth = d.style.borderWidth;
                ctx.strokeStyle = d.style.borderColor;
                ctx.stroke();
            }
            const img = decodedImages[index];
            if (img && d.img) {
                const ix = originX + d.img.rect.x;
                const iy = originY + d.img.rect.y;
                const iw = d.img.rect.w;
                const ih = d.img.rect.h;
                ctx.save();
                drawRoundedRectPath(ctx, ix, iy, iw, ih, d.img.style.borderRadius);
                ctx.clip();
                const pixelated = d.img.style.imageRendering === "pixelated" || d.img.style.imageRendering === "crisp-edges";
                ctx.imageSmoothingEnabled = !pixelated;
                ctx.imageSmoothingQuality = "high";
                const coverScale = Math.max(iw / img.naturalWidth, ih / img.naturalHeight);
                const dw = img.naturalWidth * coverScale;
                const dh = img.naturalHeight * coverScale;
                const dx = ix + (iw - dw) / 2;
                const dy = iy + (ih - dh) / 2;
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();
            } else {
                const ph = d.placeholder;
                if (ph && ph.rect) {
                    const px = originX + ph.rect.x + ph.rect.w / 2;
                    const py = originY + ph.rect.y + ph.rect.h / 2;
                    ctx.save();
                    ctx.fillStyle = ph.style.backgroundColor && ph.style.backgroundColor !== "rgba(0, 0, 0, 0)" ? ph.style.backgroundColor : getComputedStyle(document.documentElement).getPropertyValue("--image-bg").trim() || "#eeeeee";
                    drawRoundedRectPath(ctx, originX + ph.rect.x, originY + ph.rect.y, ph.rect.w, ph.rect.h, 4);
                    ctx.fill();
                    ctx.font = `${ph.style.fontSize}px ${ph.style.fontFamily}`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(ph.text || "🎵", px, py);
                    ctx.restore();
                }
            }
            const audioIconRect = d.isAudio ? d.img ? d.img.rect : d.placeholder ? d.placeholder.rect : null : null;
            if (audioIconRect) {
                const ix = originX + audioIconRect.x;
                const iy = originY + audioIconRect.y;
                const iw = audioIconRect.w;
                const ih = audioIconRect.h;
                const barH = Math.max(10, Math.min(14, ih * .28));
                ctx.save();
                drawRoundedRectPath(ctx, ix, iy, iw, ih, 4);
                ctx.clip();
                ctx.fillStyle = "rgba(0,0,0,.55)";
                ctx.fillRect(ix, iy + ih - barH, iw, barH);
                const triSize = barH * .55;
                const triX = ix + 6;
                const triY = iy + ih - barH / 2;
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.moveTo(triX, triY - triSize / 2);
                ctx.lineTo(triX, triY + triSize / 2);
                ctx.lineTo(triX + triSize, triY);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            if (d.rank && d.rank.rect) {
                ctx.fillStyle = d.rank.style.color;
                ctx.font = `${d.rank.style.fontWeight} ${d.rank.style.fontSize}px ${d.rank.style.fontFamily}`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(d.rank.text, originX + d.rank.rect.x + d.rank.rect.w / 2, originY + d.rank.rect.y + d.rank.rect.h / 2);
            }
            if (d.name && d.name.rect) {
                ctx.fillStyle = d.name.style.color;
                ctx.font = `${d.name.style.fontWeight} ${d.name.style.fontSize}px ${d.name.style.fontFamily}`;
                const centered = d.name.style.textAlign === "center";
                ctx.textAlign = centered ? "center" : "left";
                ctx.textBaseline = "middle";
                const nameX = centered ? originX + d.name.rect.x + d.name.rect.w / 2 : originX + d.name.rect.x;
                const nameY = d.tie ? originY + d.name.rect.y + d.name.rect.h * .35 : originY + d.name.rect.y + d.name.rect.h / 2;
                drawEllipsizedText(ctx, d.name.text, nameX, nameY, d.name.rect.w);
                if (d.tie && d.tie.rect) {
                    ctx.fillStyle = d.tie.style.color;
                    ctx.font = `${d.tie.style.fontWeight} ${d.tie.style.fontSize}px ${d.tie.style.fontFamily}`;
                    const tieCentered = d.tie.style.textAlign === "center";
                    ctx.textAlign = tieCentered ? "center" : "left";
                    ctx.textBaseline = "middle";
                    const tieX = tieCentered ? originX + d.tie.rect.x + d.tie.rect.w / 2 : originX + d.tie.rect.x;
                    drawEllipsizedText(ctx, d.tie.text, tieX, originY + d.tie.rect.y + d.tie.rect.h / 2, d.tie.rect.w);
                }
            }
        });
        const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (!pngBlob) throw new Error("PNG generation failed.");
        const downloadUrl = URL.createObjectURL(pngBlob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = buildResultsPngFilename();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 2e3);
    } catch (err) {
        console.error("[SORTER] Error while exporting the results as PNG:", err);
        alert("Unable to export the Results as a PNG image.\n\nDetail: " + (err && err.message ? err.message : err));
    } finally {
        listEl.scrollLeft = prevScrollLeft;
        listEl.scrollTop = prevScrollTop;
        hiddenExtras.forEach(({el: el, display: display}) => {
            el.style.display = display;
        });
        btnExportResultsPng.disabled = false;
        btnExportResultsPng.textContent = originalLabel;
    }
}
